# Publish docs/ to GitHub Pages (https://xianneuro.github.io/narRaters/).
# After the first successful run: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp sitemap lastmod
        run: |
          LASTMOD=$(date -u +%Y-%m-%d)
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${LASTMOD}</lastmod>|" docs/sitemap.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Notify search engines
        if: success()
        env:
          SITE: https://xianneuro.github.io/narRaters/
          INDEXNOW_KEY: narRatersIndexNow2026Key7f3c9a2e
        run: |
          SITEMAP="${SITE}sitemap.xml"
          KEYLOC="${SITE}${INDEXNOW_KEY}.txt"
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"xianneuro.github.io\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"${KEYLOC}\",\"urlList\":[\"${SITE}\",\"${SITEMAP}\"]}"
          curl -fsS "https://www.bing.com/ping?sitemap=${SITEMAP}" || true
