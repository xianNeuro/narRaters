# Build narRaters (hatchling) and publish to PyPI when a GitHub Release is published.
#
# One-time PyPI setup (trusted publishing — no API token in GitHub secrets):
#   1. https://pypi.org/manage/account/publishing/ → Add pending publisher
#   2. PyPI project name: narraters  (normalized from pyproject "narRaters")
#   3. Owner: xianNeuro, repo: narRaters, workflow: python-publish.yml, environment: pypi
#   4. GitHub → Settings → Environments → New environment "pypi" (optional protection rules)
#
# Release: bump version in pyproject.toml, tag (e.g. v0.1.0), publish the GitHub Release.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build release distributions
        run: python -m build

      - name: Verify distributions
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/narraters/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
