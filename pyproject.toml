[project]
name = "narRaters"
version = "0.4.0a3"
description = "AI-assisted narrative processing with human-screening — pipeline + web UI for audio/text narratives."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Xian Li", email = "xianl.cogneuro@gmail.com" },
    { name = "Gabriel Kressin Palacios", email = "gkressi1@jhu.edu"}
]
keywords = [
    "narrative",
    "recall",
    "free-recall",
    "cognitive-science",
    "cognitive-neuroscience",
    "memory",
    "event-segmentation",
    "nlp",
    "transcription",
    "human-rater",
    "causal-rating",
    "narRaters",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "flask>=2.3.0",
    "flask-login>=0.6.3",
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "pyspellchecker>=0.7.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
api = [
    "anthropic>=0.34.0",
    "openai>=1.0.0",
]
audio = [
    "openai-whisper>=20231117",
    "whisperx>=3.3.0",
]
nlp = [
    "spacy>=3.5.0",
    "benepar>=0.2.0",
]
grammar = [
    "language-tool-python>=2.7.0",
]
local-llm = [
    "transformers>=4.44",
    "torch>=2.0",
    "accelerate>=0.26",
]
match = [
    # rmatch temporarily removed; re-add "rmatch>=0.3.2" to re-enable.
]
# Production hosting (VPS): a real WSGI server for `narraters serve --production`.
# Local use does not need this — the default `narraters serve` uses Flask's
# built-in dev server. See HOSTING.md.
deploy = [
    "waitress>=3.0.0",
]
all = [
    "anthropic>=0.34.0",
    "openai>=1.0.0",
]

[project.scripts]
narraters = "narraters.cli:main"

[project.urls]
Homepage = "https://xianneuro.github.io/narRaters/"
Documentation = "https://github.com/xianNeuro/narRaters/blob/main/README.md"
Repository = "https://github.com/xianNeuro/narRaters"
Issues = "https://github.com/xianNeuro/narRaters/issues"
"Feedback" = "https://github.com/xianNeuro/narRaters/issues/new?template=feedback"
Download = "https://github.com/xianNeuro/narRaters/archive/refs/tags/v0.3.15.zip"

[build-system]
# Pin hatchling: newer releases emit Metadata-Version 2.5, which the twine in
# the publish workflow rejects ("not a valid metadata version"). 1.26.3 emits
# the widely-supported 2.3.
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narraters"]

# Bundle legacy pipeline + UI assets into the wheel under site-packages/narraters/
# so ``repo_root()`` resolves correctly after ``pip install`` (see narraters.paths).
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "narraters/scripts"
"server" = "narraters/server"
"templates" = "narraters/templates"
"static" = "narraters/static"
"helpers/__init__.py" = "narraters/helpers/__init__.py"
"helpers/anthropic_ids.py" = "narraters/helpers/anthropic_ids.py"
"helpers/disk_space.py" = "narraters/helpers/disk_space.py"
"helpers/feedback_links.py" = "narraters/helpers/feedback_links.py"
"helpers/flexible_io.py" = "narraters/helpers/flexible_io.py"
"helpers/gemma_environment.py" = "narraters/helpers/gemma_environment.py"
"helpers/ollama_gemma_e4b.py" = "narraters/helpers/ollama_gemma_e4b.py"
"helpers/plot_matrix_comparison.py" = "narraters/helpers/plot_matrix_comparison.py"
"helpers/resource_preflight.py" = "narraters/helpers/resource_preflight.py"
"helpers/software_paths.py" = "narraters/helpers/software_paths.py"
"helpers/step_types.py" = "narraters/helpers/step_types.py"
"helpers/step_files.py" = "narraters/helpers/step_files.py"
"helpers/util_software_env.py" = "narraters/helpers/util_software_env.py"
"data/1_story_audio" = "narraters/data/1_story_audio"
"data/2_story_transcript" = "narraters/data/2_story_transcript"
"data/3_story_events" = "narraters/data/3_story_events"
"data/4_recall_audio/.gitkeep" = "narraters/data/4_recall_audio/.gitkeep"
"data/5_recall_texts" = "narraters/data/5_recall_texts"
"output" = "narraters/output"

[tool.hatch.build.targets.sdist]
include = [
    "src/narraters",
    "scripts",
    "server",
    "templates",
    "static",
    "helpers",
    "data/1_story_audio",
    "data/2_story_transcript",
    "data/3_story_events",
    "data/4_recall_audio/.gitkeep",
    "data/5_recall_texts",
    "output",
    "README.md",
    "LICENSE",
    "SETUP_API.md",
    ".env.example",
    "pyproject.toml",
]
