[project]
name = "narRaters"
version = "0.2.0"
description = "AI-assisted narrative processing with human-screening — pipeline + web UI for audio/text narratives."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Xian Li", email = "xianl.cogneuro@gmail.com" },
]
keywords = ["narrative", "recall", "cognitive-science", "nlp", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "flask>=2.3.0",
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "pyspellchecker>=0.7.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
api = [
    "anthropic>=0.34.0",
    "openai>=1.0.0",
]
audio = [
    "openai-whisper>=20231117",
    "whisperx>=3.3.0",
]
nlp = [
    "spacy>=3.5.0",
    "benepar>=0.2.0",
]
grammar = [
    "language-tool-python>=2.7.0",
]
local-llm = [
    "transformers>=4.44",
    "torch>=2.0",
    "accelerate>=0.26",
]
match = [
    "rmatch>=0.3.2",
]
all = [
    "anthropic>=0.34.0",
    "openai>=1.0.0",
    "rmatch>=0.3.2",
]

[project.scripts]
narraters = "narraters.cli:main"

[project.urls]
Homepage = "https://github.com/xianNeuro/narRaters"
Documentation = "https://github.com/xianNeuro/narRaters/blob/main/README.md"
Repository = "https://github.com/xianNeuro/narRaters"
Issues = "https://github.com/xianNeuro/narRaters/issues"
"Feedback" = "https://github.com/xianNeuro/narRaters/issues/new?template=feedback"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narraters"]

# Bundle legacy pipeline + UI assets into the wheel under site-packages/narraters/
# so ``repo_root()`` resolves correctly after ``pip install`` (see narraters.paths).
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "narraters/scripts"
"server" = "narraters/server"
"templates" = "narraters/templates"
"static" = "narraters/static"
"helpers" = "narraters/helpers"

[tool.hatch.build.targets.sdist]
include = [
    "src/narraters",
    "scripts",
    "server",
    "templates",
    "static",
    "helpers",
    "README.md",
    "LICENSE",
    "SETUP_API.md",
    ".env.example",
    "pyproject.toml",
]
