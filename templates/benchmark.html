<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark — narRaters</title>
    <script src="/static/theme-manager.js"></script>
    <script src="/static/zoom-controls.js"></script>
    <style>
        :root {
            --bg0: #0b0d14;
            --bg1: #111527;
            --bg2: #1a1f36;
            --bg3: #242b4a;
            --t0: #f0f2f5;
            --t1: #c4c9db;
            --t2: #8890a8;
            --bdr: #2a3050;
            --bdr2: #353c60;
            --acc: #6c63ff;
            --acc2: #8b84ff;
            --green: #22c55e;
            --rad: 10px;
            --tr: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg0);
            color: var(--t0);
            min-height: 100vh;
            padding: 48px 24px;
        }

        /* Top-right control row, mirrored from the rating window. */
        .bench-controls {
            position: fixed; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 8px; z-index: 1000;
        }
        .back-link {
            color: var(--t0);
            text-decoration: none;
            opacity: 0.9;
            height: 34px;
            display: inline-flex;
            align-items: center;
            padding: 0 14px;
            line-height: 1;
            background: var(--bg2);
            border: 1px solid var(--bdr);
            border-radius: 6px;
            font: inherit;
            font-size: 0.9em;
            cursor: pointer;
            transition: all var(--tr);
        }
        .back-link:hover {
            background: var(--bg3);
            border-color: var(--acc);
            opacity: 1;
            transform: translateY(-2px);
        }
        .back-link[disabled] {
            opacity: 0.4;
            cursor: default;
        }
        .back-link[disabled]:hover {
            background: var(--bg2);
            border-color: var(--bdr);
            opacity: 0.4;
            transform: none;
        }
        /* The zoom script injects its own floating controls; we render our own
           in the row above, so hide its set here. */
        .page-zoom-controls { display: none; }

        .wrap {
            max-width: 920px;
            margin: 0 auto;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        h1 .name {
            color: var(--acc2);
        }

        .sub {
            color: var(--t2);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .progress {
            color: var(--t1);
            font-size: 14px;
            margin-bottom: 14px;
        }

        .progress b {
            color: var(--t0);
        }

        .card {
            background: var(--bg1);
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--t2);
            padding: 8px 18px;
            border-bottom: 1px solid var(--bdr);
            background: var(--bg2);
        }

        tbody td {
            padding: 8px 18px;
            border-bottom: 1px solid var(--bdr);
            /* match the rating window's recall-segment text size */
            font-size: 0.95rem;
            line-height: 1.45;
            color: var(--t1);
        }

        tbody tr {
            cursor: pointer;
            transition: background var(--tr);
        }

        tbody tr:hover {
            background: var(--bg2);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .ds {
            color: var(--t0);
            font-weight: 600;
        }

        .mono {
            font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--bdr2);
            color: var(--t2);
        }

        .badge.rated {
            color: var(--green);
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.1);
        }

        .badge.in-progress {
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.4);
            background: rgba(96, 165, 250, 0.12);
        }

        .empty,
        .loading {
            padding: 40px 18px;
            text-align: center;
            color: var(--t2);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="bench-controls">
        <button type="button" class="back-link" onclick="if(window.PageZoom)PageZoom.out()" title="Make the page smaller">-</button>
        <button type="button" class="back-link" onclick="if(window.PageZoom)PageZoom.in()" title="Make the page bigger">+</button>
        {% if require_auth %}
        <button type="button" class="back-link" onclick="benchmarkLogout()" title="Log out">⎋ Log out</button>
        {% else %}
        <button type="button" class="back-link" disabled title="No login required in local mode">⎋ Log out</button>
        {% endif %}
    </div>
    <div class="wrap">
        <h1>Hi <i><span class="name">{{ username }}</span></i>!</h1>
        <div class="sub">Pick a recall file to start rating.</div>

        <div class="progress" id="progress"></div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Dataset</th>
                        <th>Story</th>
                        <th>Sub&nbsp;ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="rows">
                    <tr>
                        <td colspan="4" class="loading">Loading…</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function openItem(id) {
            window.location.href = '/subject/' + encodeURIComponent(id) + '?step=step3';
        }

        async function benchmarkLogout() {
            try { await fetch('/api/logout', { method: 'POST' }); }
            catch (e) { console.error('Logout error:', e); }
            finally { window.location.href = '/login'; }
        }

        async function load() {
            const tbody = document.getElementById('rows');
            try {
                const resp = await fetch('/api/benchmark/files');
                const data = await resp.json();
                const files = data.files || [];

                if (!files.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty">No recall files found under benchmark/unrated/.</td></tr>';
                    document.getElementById('progress').textContent = '';
                    return;
                }

                const statusOf = f => f.status || (f.rated ? 'rated' : 'not_rated');
                const ratedCount = files.filter(f => statusOf(f) === 'rated').length;
                const inProgressCount = files.filter(f => statusOf(f) === 'in_progress').length;
                document.getElementById('progress').innerHTML =
                    '<b>' + ratedCount + '</b> of <b>' + files.length + '</b> rated' +
                    (inProgressCount ? ' · <b>' + inProgressCount + '</b> in progress' : '');

                tbody.innerHTML = files.map(f => {
                    const st = statusOf(f);
                    const status = st === 'rated'
                        ? '<span class="badge rated">Rated</span>'
                        : st === 'in_progress'
                            ? '<span class="badge in-progress">In progress</span>'
                            : '<span class="badge">Not rated</span>';
                    return '<tr onclick="openItem(\'' + escapeHtml(f.id) + '\')">' +
                        '<td class="ds">' + escapeHtml(f.datasource) + '</td>' +
                        '<td>' + escapeHtml(f.story) + '</td>' +
                        '<td class="mono">' + escapeHtml(f.sub_id) + '</td>' +
                        '<td>' + status + '</td>' +
                        '</tr>';
                }).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty">Failed to load files: ' + escapeHtml(e.message) + '</td></tr>';
            }
        }

        load();
    </script>
</body>

</html>
