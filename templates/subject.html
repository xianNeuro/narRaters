                                    causal_type: (row.coarse_causal_type !== undefined && row.coarse_causal_type !== null) ? String(row.coarse_causal_type) : '',
                                    referential: (row.coarse_referential !== undefined && row.coarse_referential !== '') ? (parseInt(row.coarse_referential, 10) || 0) : 0,
                                    contextual: (row.coarse_contextual !== undefined && row.coarse_contextual !== '') ? (parseInt(row.coarse_contextual, 10) || 0) : 0,
                                    semantic: (row.coarse_semantic !== undefined && row.coarse_semantic !== '') ? (parseInt(row.coarse_semantic, 10) || 0) : 0,
                                };
                                _cp.push(_cpRow);
                            });
                        } else if (body.coarse_pairs && body.coarse_pairs.length) {
                            body.coarse_pairs.forEach(function(cp) {
                                if ((cp.rating || 0) > 0) _cp.push(cp);
                            });
                        }
                        window._causalRatingsData.coarse_pairs = _cp;
                    }
                    initCausalMatrixState();
                    btn.disabled = true;
                } else {
                    statusDiv.textContent = 'Error: ' + (result.error || 'Unknown error');
                    statusDiv.className = 'save-status error';
                }
            } catch (error) {
                statusDiv.textContent = 'Error: ' + error.message;
                statusDiv.className = 'save-status error';
            }
            
            setTimeout(() => {
                statusDiv.className = 'save-status';
                statusDiv.style.display = 'none';
            }, 5000);
        }
        
        // ==============================
        // NESTED RATING (Coarse/Fine)
        // ==============================
        
        let nestedRatingActive = false;
        
        function toggleNestedRating() {
            const cb = document.getElementById('flag-nested-rating');
            if (!cb || cb.disabled) return;
            const toggle = document.getElementById('nested-rating-toggle');
            nestedRatingActive = cb.checked;
            if (toggle) toggle.classList.toggle('active', nestedRatingActive);
            
            if (nestedRatingActive) {
                renderNestedCoarseMatrix();
            } else {
                restoreFlatMatrix();
            }
        }
        
        function fineEventNumToCoarseIdx(evNum) {
            const g = window._eventGranularities;
            const m = window._fineToCoarseMap;
            if (!g || !g.fine || !m) return -1;
            for (let ci = 0; ci < g.coarse.length; ci++) {
                const idxs = m[ci] || [];
                for (let k = 0; k < idxs.length; k++) {
                    const fe = g.fine[idxs[k]];
                    if (String(fe.event) === String(evNum)) return ci;
                }
            }
            return -1;
        }
        
        function getCausalMatrixExportFlags() {
            return {
                reasoning: !!(document.getElementById('flag-reasoning') && document.getElementById('flag-reasoning').checked),
                causal_type: !!(document.getElementById('flag-causal-type') && document.getElementById('flag-causal-type').checked),
                referential: !!(document.getElementById('flag-referential') && document.getElementById('flag-referential').checked),
                contextual: !!(document.getElementById('flag-contextual') && document.getElementById('flag-contextual').checked),
                semantic: !!(document.getElementById('flag-semantic') && document.getElementById('flag-semantic').checked),
            };
        }
        
        function buildNestedCombinedExportRows() {
            const flags = getCausalMatrixExportFlags();
            const g = window._eventGranularities;
            if (!g || !g.coarse || !g.fine) return [];
            if (!window._fineToCoarseMap) {
                window._fineToCoarseMap = mapFineToCoarse(g.fine, g.coarse);
            }
            const coarseList = g.coarse;
            const nested = window._nestedRatingData || {};
            const coarseRatings = window._nestedCoarseRatingData || {};
            const groups = {};
            function ensureGroup(k) {
                if (!groups[k]) groups[k] = { finePairs: [] };
                return groups[k];
            }
            Object.entries(nested).forEach(([key, data]) => {
                if ((data.rating || 0) <= 0) return;
                const ix = key.indexOf('_');
                if (ix < 0) return;
                const causeStr = key.slice(0, ix);
                const effectStr = key.slice(ix + 1);
                const ci = fineEventNumToCoarseIdx(causeStr);
                const ri = fineEventNumToCoarseIdx(effectStr);
                if (ci < 0 || ri < 0) return;
                const gk = ci + '_' + ri;
                ensureGroup(gk).finePairs.push({
                    event_A: parseInt(causeStr, 10),
                    event_B: parseInt(effectStr, 10),
                    rating: data.rating,
                    reasoning: data.reasoning || '',
                    causal_type: data.causal_type || '',
                    referential: data.referential || 0,
                    contextual: data.contextual || 0,
                    semantic: data.semantic || 0,
                });
            });
            Object.keys(coarseRatings).forEach(pk => ensureGroup(pk));
            const keys = Object.keys(groups).sort((a, b) => {
                const [a1, a2] = a.split('_').map(Number);
                const [b1, b2] = b.split('_').map(Number);
                if (a1 !== b1) return a1 - b1;
                return a2 - b2;
            });
            const out = [];
            function coarseOptional(cdata, hasCoarseRating, firstRow) {
                const o = {};
                const cd = cdata || {};
                const active = !!(firstRow && hasCoarseRating);
                if (flags.reasoning) {
                    if (!active || !hasCoarseRating) {
                        o.coarse_reasoning = '';
                    } else {
                        const t = (cd.reasoning && String(cd.reasoning).trim()) ? String(cd.reasoning).trim() : '';
                        o.coarse_reasoning = t || 'manual entry';
                    }
                }
                if (flags.causal_type) {
                    o.coarse_causal_type = (!active || !hasCoarseRating) ? '' : String(cd.causal_type || '');
                }
                if (flags.referential) {
                    o.coarse_referential = (!active || !hasCoarseRating) ? '' : (parseInt(cd.referential, 10) || 0);
                }
                if (flags.contextual) {
                    o.coarse_contextual = (!active || !hasCoarseRating) ? '' : (parseInt(cd.contextual, 10) || 0);
                }
                if (flags.semantic) {
                    o.coarse_semantic = (!active || !hasCoarseRating) ? '' : (parseInt(cd.semantic, 10) || 0);
                }
                return o;
            }
            function fineOptional(fp, fr) {
                const o = {};
                const active = fr > 0;
                if (flags.reasoning) {
                    if (!active) {
                        o.fine_reasoning = '';
                    } else {
                        const t = (fp.reasoning && String(fp.reasoning).trim()) ? String(fp.reasoning).trim() : '';
                        o.fine_reasoning = t || 'manual entry';
                    }
                }
                if (flags.causal_type) {
                    o.fine_causal_type = active ? String(fp.causal_type || '') : '';
                }
                if (flags.referential) {
                    o.fine_referential = active ? (parseInt(fp.referential, 10) || 0) : '';
                }
                if (flags.contextual) {
                    o.fine_contextual = active ? (parseInt(fp.contextual, 10) || 0) : '';
                }
                if (flags.semantic) {
                    o.fine_semantic = active ? (parseInt(fp.semantic, 10) || 0) : '';
                }
                return o;
            }
            keys.forEach(gk => {
                const [ci, ri] = gk.split('_').map(Number);
                const cdata = coarseRatings[gk] || {};
                const fineList = (groups[gk].finePairs || []).slice().sort((p, q) =>
                    (p.event_A - q.event_A) || (p.event_B - q.event_B));
                const caNum = coarseList[ci].event;
                const cbNum = coarseList[ri].event;
                const coarseR = (cdata.rating || 0) > 0 ? cdata.rating : '';
                const hasCoarseRating = coarseR !== '' && parseInt(coarseR, 10) > 0;
                if (fineList.length === 0) {
                    const row = {
                        'event_A_coarse-number': caNum,
                        'event_B_coarse-number': cbNum,
                        coarse_rating: coarseR,
                    };
                    Object.assign(row, coarseOptional(cdata, hasCoarseRating, true));
                    row.event_A_number = '';
                    row.event_B_number = '';
                    row.fine_rating = '';
                    Object.assign(row, fineOptional({}, 0));
                    out.push(row);
                    return;
                }
                fineList.forEach((fp, idx) => {
                    const row = {
                        'event_A_coarse-number': idx === 0 ? caNum : '',
                        'event_B_coarse-number': idx === 0 ? cbNum : '',
                        coarse_rating: idx === 0 ? coarseR : '',
                    };
                    Object.assign(row, coarseOptional(cdata, hasCoarseRating, idx === 0));
                    row.event_A_number = fp.event_A;
                    row.event_B_number = fp.event_B;
                    row.fine_rating = fp.rating;
                    Object.assign(row, fineOptional(fp, fp.rating));
                    out.push(row);
                });
            });
            return out;
        }
        
        function coarseLevelCellExtraClass(coarseCauseIdx, coarseEffectIdx) {
            var pk = coarseCauseIdx + '_' + coarseEffectIdx;
            var cd = (window._nestedCoarseRatingData || {})[pk];
            var parts = [];
            if (!cd || !cd._completed) {
                parts.push('coarse-level-unrated');
            } else {
                var cr = Math.min(3, Math.max(0, parseInt(cd.rating, 10) || 0));
                parts.push('coarse-level-rating-' + cr);
                var rs = cd.reasoning && String(cd.reasoning).trim();
                if (rs && rs !== 'manual entry') parts.push('has-reasoning');
            }
            return ' ' + parts.join(' ');
        }
        
        function applyCoarseLevelMatrixCellStyle(td) {
            if (!td || td.getAttribute('data-coarse-cause') == null) return;
            ['coarse-level-unrated', 'coarse-level-rating-0', 'coarse-level-rating-1', 'coarse-level-rating-2', 'coarse-level-rating-3'].forEach(function(cl) {
                td.classList.remove(cl);
            });
            td.classList.remove('has-reasoning');
            var c = parseInt(td.getAttribute('data-coarse-cause'), 10);
            var r = parseInt(td.getAttribute('data-coarse-effect'), 10);
            coarseLevelCellExtraClass(c, r).trim().split(/\s+/).filter(Boolean).forEach(function(cl) {
                td.classList.add(cl);
            });
        }
        
        function mapFineToCoarse(fineEvents, coarseEvents) {
            const mapping = {};
            for (let ci = 0; ci < coarseEvents.length; ci++) mapping[ci] = [];
            
            let fi = 0;
            for (let ci = 0; ci < coarseEvents.length; ci++) {
                const coarseWords = coarseEvents[ci].text.replace(/\s+/g, ' ').trim().toLowerCase().split(/\s+/);
                let matched = 0;
                while (fi < fineEvents.length) {
                    const fineWords = fineEvents[fi].text.replace(/\s+/g, ' ').trim().toLowerCase().split(/\s+/);
                    let found = true;
                    for (let w = 0; w < Math.min(3, fineWords.length); w++) {
                        if (!coarseWords.slice(matched).some((cw, idx) => cw === fineWords[w] && idx < fineWords.length + 5)) {
                            found = false;
                            break;
                        }
                    }
                    if (found) {
                        mapping[ci].push(fi);
                        matched += fineWords.length;
                        fi++;
                    } else {
                        break;
                    }
                }
            }
            return mapping;
        }
        
        function renderNestedCoarseMatrix() {
            const gran = window._eventGranularities;
            if (!gran || !gran.fine || !gran.coarse) return;
            
            const coarse = gran.coarse;
            const fine = gran.fine;
            window._fineToCoarseMap = mapFineToCoarse(fine, coarse);
            
            const causalData = window._causalRatingsData;
            window._nestedRatingData = window._nestedRatingData || {};
            window._nestedCoarseRatingData = window._nestedCoarseRatingData || {};
            if (causalData && causalData.pairs) {
                causalData.pairs.forEach(p => {
                    const key = p.event_A + '_' + p.event_B;
                    if (!(key in window._nestedRatingData)) {
                        window._nestedRatingData[key] = {
                            rating: p.rating || 0,
                            reasoning: p.reasoning || '',
                            causal_type: p.causal_type || '',
                            referential: p.referential || 0,
                            contextual: p.contextual || 0,
                            semantic: p.semantic || 0,
                        };
                    }
                });
            }
            if (causalData && causalData.coarse_pairs && coarse.length) {
                causalData.coarse_pairs.forEach(p => {
                    const cIdx = coarse.findIndex(e => String(e.event) === String(p.event_A));
                    const rIdx = coarse.findIndex(e => String(e.event) === String(p.event_B));
                    if (cIdx < 0 || rIdx < 0) return;
                    const ck = cIdx + '_' + rIdx;
                    if (!(ck in window._nestedCoarseRatingData)) {
                        window._nestedCoarseRatingData[ck] = {
                            rating: p.rating || 0,
                            reasoning: p.reasoning || '',
                            causal_type: p.causal_type || '',
                            referential: p.referential || 0,
                            contextual: p.contextual || 0,
                            semantic: p.semantic || 0,
                            _completed: true,
                            event_A: p.event_A,
                            event_B: p.event_B,
                        };
                    }
                });
            }
            
            const n = coarse.length;
            
            let matrixHeaderCells = '<th style="font-size:0.7em; line-height:1.1; padding:2px;">Cause →<br>Effect ↓</th>';
            for (let c = 0; c < n; c++) {
                const title = coarse[c].text.substring(0, 100) + (coarse[c].text.length > 100 ? '...' : '');
                matrixHeaderCells += `<th title="${escapeHtml(title)}">C${coarse[c].event}</th>`;
            }
            
            let matrixRows = '';
            for (let r = 0; r < n; r++) {
                const effectFine = window._fineToCoarseMap[r] || [];
                const title = coarse[r].text.substring(0, 100) + (coarse[r].text.length > 100 ? '...' : '');
                matrixRows += `<tr><th title="${escapeHtml(title)}">C${coarse[r].event}</th>`;
                for (let c = 0; c < n; c++) {
                    if (r === c) {
                        const diagFine = window._fineToCoarseMap[r] || [];
                        const summaryHtml = buildCoarseCellSummary(diagFine, diagFine, fine);
                        const coarseCls = coarseLevelCellExtraClass(c, r);
                        matrixRows += `<td class="causal-matrix-cell diagonal${coarseCls}" style="cursor:pointer; padding:2px;" onclick="handleCoarseNestedMatrixClick(event, ${c}, ${r})" onmouseenter="causalCoarseCellEnter(event, ${c}, ${r})" onmousemove="moveCausalHover(event)" onmouseleave="causalCellLeave()" data-coarse-cause="${c}" data-coarse-effect="${r}">${summaryHtml}</td>`;
                    } else {
                        const causeFine = window._fineToCoarseMap[c] || [];
                        const summaryHtml = buildCoarseCellSummary(causeFine, effectFine, fine);
                        const coarseCls = coarseLevelCellExtraClass(c, r);
                        matrixRows += `<td class="causal-matrix-cell${coarseCls}" style="cursor:pointer; padding:2px;" onclick="handleCoarseNestedMatrixClick(event, ${c}, ${r})" onmouseenter="causalCoarseCellEnter(event, ${c}, ${r})" onmousemove="moveCausalHover(event)" onmouseleave="causalCellLeave()" data-coarse-cause="${c}" data-coarse-effect="${r}">${summaryHtml}</td>`;
                    }
                }
                matrixRows += '</tr>';
            }
            
            const wrapper = document.querySelector('.causal-matrix-wrapper');
            if (wrapper) {
                wrapper.classList.add('nested-coarse-view');
                wrapper.innerHTML = `<table class="causal-matrix-table"><thead><tr>${matrixHeaderCells}</tr></thead><tbody>${matrixRows}</tbody></table>`;
            }
            
            const eventsList = document.getElementById('causal-events-list');
            if (eventsList) {
                eventsList.innerHTML = coarse.map(ev =>
                    '<div class="causal-event-item" id="ce-item-' + ev.event + '"><div class="ce-num">Coarse Event ' + ev.event + '</div><div>' + escapeHtml(ev.text) + '</div></div>'
                ).join('');
            }
            updateCausalConnectionLines();

        function buildCoarseCellSummary(causeFineIndices, effectFineIndices, fineEvents) {
            if (!causeFineIndices.length || !effectFineIndices.length) return '';
            const nestedData = window._nestedRatingData || {};
            const nRows = effectFineIndices.length;
            const nCols = causeFineIndices.length;
            let cells = '';
            for (let ei = 0; ei < nRows; ei++) {
                for (let ci = 0; ci < nCols; ci++) {
                    const causeEv = fineEvents[causeFineIndices[ci]];
                    const effectEv = fineEvents[effectFineIndices[ei]];
                    const key = causeEv.event + '_' + effectEv.event;
                    const r = nestedData[key] ? (nestedData[key].rating || 0) : 0;
                    cells += `<span class="mini-cell r${r}"></span>`;
                }
            }
            return `<div class="coarse-cell-summary" style="grid-template-columns: repeat(${nCols}, 6px); grid-template-rows: repeat(${nRows}, 6px);">${cells}</div>`;
        }
        
        function causalCoarseCellEnter(event, coarseColIdx, coarseRowIdx) {
            if (window._causalRatingInProgress) return;
            const gran = window._eventGranularities;
            if (!gran) return;
            const coarse = gran.coarse;
            const causeEv = coarse[coarseColIdx] ? coarse[coarseColIdx].event : null;
            const effectEv = coarse[coarseRowIdx] ? coarse[coarseRowIdx].event : null;
            const causeText = coarse[coarseColIdx] ? coarse[coarseColIdx].text : '';
            const effectText = coarse[coarseRowIdx] ? coarse[coarseRowIdx].text : '';
            
            clearCausalHoverLabels();
            var cell = event.currentTarget;
            var rect = cell.getBoundingClientRect();
            
            var topLabel = document.createElement('div');
            topLabel.className = 'causal-hover-top';
            topLabel.id = 'causal-hover-top-el';
            topLabel.textContent = 'Cause C' + causeEv + ': ' + causeText;
            document.body.appendChild(topLabel);
            var tRect = topLabel.getBoundingClientRect();
            var tLeft = Math.max(4, Math.min(rect.left, window.innerWidth - 8 - tRect.width));
            topLabel.style.left = tLeft + 'px';
            topLabel.style.top = Math.max(4, rect.top - 4 - tRect.height) + 'px';
            
            var leftLabel = document.createElement('div');
            leftLabel.className = 'causal-hover-left';
            leftLabel.id = 'causal-hover-left-el';
            leftLabel.textContent = 'Effect C' + effectEv + ': ' + effectText;
            document.body.appendChild(leftLabel);
            var lRect = leftLabel.getBoundingClientRect();
            var lLeft = rect.left - 4 - lRect.width;
            var lTop = rect.top + rect.height / 2 - lRect.height / 2;
            if (lLeft < 4) lLeft = rect.right + 4;
            if (lLeft + lRect.width > window.innerWidth - 8) lLeft = window.innerWidth - 8 - lRect.width;
            if (lTop < 4) lTop = 4;
            if (lTop + lRect.height > window.innerHeight - 8) lTop = window.innerHeight - 8 - lRect.height;

            const effectFineIndices = window._fineToCoarseMap[coarseEffectIdx] || [];

        function _nestedZoomEscapeHandler(e) {

        function nestedCellEnter(event, colIdx, rowIdx, coarseCauseIdx, coarseEffectIdx) {

            const causeEv = fine[causeFineIndices[colIdx]];
            const effectEv = fine[effectFineIndices[rowIdx]];
            if (!causeEv || !effectEv) return;
            
            clearCausalHoverLabels();
            var cell = event.currentTarget;
            var rect = cell.getBoundingClientRect();
            
            var topLabel = document.createElement('div');
            topLabel.className = 'causal-hover-top';
            topLabel.id = 'causal-hover-top-el';
            topLabel.textContent = 'Cause ' + causeEv.event + ': ' + causeEv.text;
            document.body.appendChild(topLabel);
            var tRect = topLabel.getBoundingClientRect();

        // Audio transcription synchronization
        let transcriptionSentences = [];
        let sentenceElements = [];
        let wordElements = [];
        let wordBoundaries = [];  // { start, end } for each word (character offsets in full text)
        let currentHighlightedIndex = -1;
        let currentHighlightedWordIndex = -1;
        
        function splitIntoSentences(text) {
            if (!text || text.trim().length === 0) return [];
            // Split by sentence-ending punctuation, keeping the punctuation
            const sentences = text.split(/([.!?]+[\s\n]+)/).filter(s => s.trim().length > 0);
            const result = [];
            for (let i = 0; i < sentences.length; i += 2) {
                if (i + 1 < sentences.length) {
                    result.push(sentences[i] + sentences[i + 1]);
                } else {
                    result.push(sentences[i]);
                }
            }
            return result.length > 0 ? result : [text];
        }
        
        function buildWordBoundaries(text) {
            wordBoundaries = [];
            const re = /\S+/g;
            let m;
            while ((m = re.exec(text)) !== null) {
                wordBoundaries.push({ start: m.index, end: m.index + m[0].length });
            }
            return wordBoundaries;
        }
        
        function getWordIndexAtCursor(cursorPos) {
            if (wordBoundaries.length === 0) return -1;
            if (cursorPos <= 0) return 0;
            for (let i = 0; i < wordBoundaries.length; i++) {
                if (cursorPos >= wordBoundaries[i].start && cursorPos <= wordBoundaries[i].end)
                    return i;
            }
            // Between words or at end: return nearest word
            if (cursorPos < wordBoundaries[0].start) return 0;
            for (let i = 0; i < wordBoundaries.length - 1; i++) {
                if (cursorPos < wordBoundaries[i + 1].start) return i;
            }
            return wordBoundaries.length - 1;
        }
        
        function highlightWordAtCursor() {
            const editor = document.getElementById('audio-transcription-editor');
            const displayDiv = document.getElementById('audio-transcription-display');
            if (!editor || !displayDiv) return;
            if (wordBoundaries.length === 0) {
                currentHighlightedWordIndex = -1;
                return;
            }
            const cursorPos = editor.selectionStart;
            const idx = getWordIndexAtCursor(cursorPos);
            if (idx < 0) return;
            if (idx === currentHighlightedWordIndex) return;
            // Clear previous word highlight
            if (currentHighlightedWordIndex >= 0 && wordElements[currentHighlightedWordIndex]) {
                wordElements[currentHighlightedWordIndex].style.backgroundColor = '';
                wordElements[currentHighlightedWordIndex].style.color = '';
                wordElements[currentHighlightedWordIndex].style.fontWeight = '';
            }
            // Clear sentence highlight when user is editing (so word highlight is visible)
            if (currentHighlightedIndex >= 0 && sentenceElements[currentHighlightedIndex]) {
                sentenceElements[currentHighlightedIndex].style.backgroundColor = '';
                sentenceElements[currentHighlightedIndex].style.color = '';
                sentenceElements[currentHighlightedIndex].style.fontWeight = '';
                currentHighlightedIndex = -1;
            }
            currentHighlightedWordIndex = idx;
            if (wordElements[idx]) {
                wordElements[idx].style.backgroundColor = 'var(--accbg)';
                wordElements[idx].style.color = 'var(--acc2)';
                wordElements[idx].style.fontWeight = '600';
                wordElements[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        
        function syncAudioTranscriptionFromEditor() {

        function renderTranscriptionWithHighlighting(transcription) {
            const displayDiv = document.getElementById('audio-transcription-display');
            if (!displayDiv) return;
            
            transcriptionSentences = splitIntoSentences(transcription);
            buildWordBoundaries(transcription);
            sentenceElements = [];
            wordElements = [];
            
            // Build HTML: sentences containing word spans (so playback can highlight sentences, cursor highlights words)
            let wordIndex = 0;
            let html = '';
            transcriptionSentences.forEach((sentence, sentIndex) => {
                const sentenceId = `sentence-${sentIndex}`;
                html += `<span id="${sentenceId}" class="transcription-sentence" data-index="${sentIndex}" style="display: inline-block; padding: 2px 4px; margin: 2px 0; border-radius: 4px; transition: all 0.2s ease;">`;
                const parts = sentence.split(/(\s+)/);
                parts.forEach(part => {
                    if (/\S/.test(part)) {
                        html += `<span id="word-${wordIndex}" class="transcription-word" data-word-index="${wordIndex}" style="padding: 0 1px; border-radius: 2px; transition: all 0.2s ease;">${escapeHtml(part)}</span>`;
                        wordIndex++;
                    } else {
                        html += escapeHtml(part);
                    }
                });
                html += '</span> ';
            });
            
            displayDiv.innerHTML = html;
            
            transcriptionSentences.forEach((_, index) => {
                const elem = document.getElementById(`sentence-${index}`);
                if (elem) sentenceElements.push(elem);
            });
            for (let i = 0; i < wordBoundaries.length; i++) {
                const elem = document.getElementById(`word-${i}`);
                if (elem) wordElements.push(elem);
            }
        }
        
        function setupAudioSynchronization() {
            const audioPlayer = document.getElementById('audio-player');
            if (!audioPlayer) return;
            
            // Reset highlighting
            currentHighlightedIndex = -1;
            
            // Wait for audio metadata to load
            audioPlayer.addEventListener('loadedmetadata', () => {
                const duration = audioPlayer.duration;
                console.log('Audio duration:', duration, 'seconds');
                
                // Calculate time per character (rough estimate)
                const editor = document.getElementById('audio-transcription-editor');
                if (!editor) return;
                
                const transcription = editor.value;
                if (!transcription || transcription.trim().length === 0) return;
                
                const totalChars = transcription.length;
                const timePerChar = duration / totalChars;
                
                // Calculate start time for each sentence
                let charOffset = 0;
                const sentenceTimes = transcriptionSentences.map(sentence => {
                    const startTime = charOffset * timePerChar;
                    charOffset += sentence.length;
                    return { start: startTime, end: charOffset * timePerChar };
                });
                
                // Update highlighting on timeupdate
                audioPlayer.addEventListener('timeupdate', () => {
                    const currentTime = audioPlayer.currentTime;
                    
                    // Find which sentence should be highlighted
                    let targetIndex = -1;
                    for (let i = 0; i < sentenceTimes.length; i++) {
                        if (currentTime >= sentenceTimes[i].start && currentTime < sentenceTimes[i].end) {
                            targetIndex = i;
                            break;
                        }
                    }
                    
                    // If we're past the last sentence, highlight the last one
                    if (targetIndex === -1 && sentenceTimes.length > 0 && currentTime >= sentenceTimes[sentenceTimes.length - 1].start) {
                        targetIndex = sentenceTimes.length - 1;
                    }
                    
                    // Update highlighting
                    if (targetIndex !== currentHighlightedIndex) {
                        // Remove previous sentence highlight
                        if (currentHighlightedIndex >= 0 && sentenceElements[currentHighlightedIndex]) {
                            sentenceElements[currentHighlightedIndex].style.backgroundColor = '';
                            sentenceElements[currentHighlightedIndex].style.color = '';
                            sentenceElements[currentHighlightedIndex].style.fontWeight = '';
                        }
                        // Clear word highlight during playback so sentence highlight is visible
                        if (currentHighlightedWordIndex >= 0 && wordElements[currentHighlightedWordIndex]) {
                            wordElements[currentHighlightedWordIndex].style.backgroundColor = '';
                            wordElements[currentHighlightedWordIndex].style.color = '';
                            wordElements[currentHighlightedWordIndex].style.fontWeight = '';
                            currentHighlightedWordIndex = -1;
                        }
                        
                        // Add new highlight
                        if (targetIndex >= 0 && sentenceElements[targetIndex]) {
                            sentenceElements[targetIndex].style.backgroundColor = '#ffeb3b';
                            sentenceElements[targetIndex].style.color = '#000';
                            sentenceElements[targetIndex].style.fontWeight = '600';
                            
                            // Scroll into view
                            sentenceElements[targetIndex].scrollIntoView({
                                behavior: 'smooth',
                                block: 'center'
                            });
                        }
                        
                        currentHighlightedIndex = targetIndex;
                    }
                });
            });
        }

        // Helper function to parse and format event numbers as integers
        function formatEventValue(value) {
            if (!value || value.trim() === '') return '';
            // Parse comma-separated values and convert to integers
            return value.split(',').map(v => {
                const num = parseInt(v.trim());
                return isNaN(num) ? '' : num;
            }).filter(v => v !== '').join(', ');
        }
        
        // Helper function to get integer event number
        function getIntEvent(event) {
            return typeof event === 'number' ? Math.floor(event) : parseInt(event) || 0;
        }
        
        function parseEventValue(value) {
            if (!value || value.trim() === '') return '';
            // Parse comma-separated values and convert to integers
            const events = value.split(',').map(v => {
                const num = parseInt(v.trim());
                return isNaN(num) ? null : Math.floor(num);
            }).filter(v => v !== null);
            // Remove duplicates and sort
            return [...new Set(events)].sort((a, b) => a - b).join(', ');
        }

        function updateParsedSegment(segmentIndex, newValue) {
            if (!parsedTextsData[segmentIndex]) {
                parsedTextsData[segmentIndex] = {};
            }
            parsedTextsData[segmentIndex].text = newValue;
        }
        
        function handleSegmentKeydown(event, segmentIndex) {
            // Handle Enter key to split segment at cursor position
            if (event.key === 'Enter' && !event.shiftKey) {
                const editor = event.target;
                const cursorPos = editor.selectionStart;
                const text = editor.value;
                
                // Split if cursor is in the middle of text (not at very start or very end)
                // Allow some margin at the end for normal text editing
                const endMargin = 1; // Allow 1 character at end for normal editing
                if (cursorPos > 0 && cursorPos < (text.length - endMargin)) {
                    event.preventDefault();
                    splitSegmentAtCursor(segmentIndex);
                }
                // If at end or start, allow normal Enter behavior (add newline)
            }
            // Shift+Enter always adds newline (normal behavior)
        }
        
        function splitSegmentAtCursor(segmentIndex) {
            const editor = document.querySelector(`.parsed-segment-editor[data-segment-index="${segmentIndex}"]`);
            if (!editor) return;
            
            const cursorPosition = editor.selectionStart;
            const text = editor.value;
            
            // Don't split if cursor is at the very beginning or end
            if (cursorPosition <= 0 || cursorPosition >= text.length) {
                return;
            }
            
            // Split the text at cursor position
            const beforeText = text.substring(0, cursorPosition).trim();
            const afterText = text.substring(cursorPosition).trim();
            
            if (!beforeText || !afterText) {
                // Can't split if one part would be empty
                return;
            }
            
            // Update current segment with text before cursor
            editor.value = beforeText;
            updateParsedSegment(segmentIndex, beforeText);
            
            // Create new segment with text after cursor
            const segmentsContainer = document.querySelector('.segments-container');
            if (!segmentsContainer) return;
            
            // Get the current segment element
            const currentSegment = document.querySelector(`.rated-segment[data-segment-index="${segmentIndex}"]`);
            if (!currentSegment) return;
            
            // Create new segment HTML
            const newSegmentIndex = segmentIndex + 1;
            const newSegmentHtml = `
                <div class="rated-segment" data-segment-index="${newSegmentIndex}">
                    <div class="rated-segment-header">
                        <span class="rated-segment-number">Segment ${newSegmentIndex + 1}</span>
                        <div class="segment-actions">
                            <button class="merge-button" onclick="mergeWithPrevious(${newSegmentIndex})" title="Merge with previous segment">← Merge</button>
                            <button class="split-button" onclick="splitSegmentAtCursor(${newSegmentIndex})" title="Split segment at cursor position (or press Enter)">Split →</button>
                        </div>
                    </div>
                    <textarea class="parsed-segment-editor" 
                              data-segment-index="${newSegmentIndex}"
                              onchange="updateParsedSegment(${newSegmentIndex}, this.value)"
                              oninput="resizeSegmentEditor(this)"
                              onkeydown="handleSegmentKeydown(event, ${newSegmentIndex})">${escapeHtml(afterText)}</textarea>
                </div>
            `;
            
            // Insert new segment after current segment
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = newSegmentHtml;
            const newSegmentElement = tempDiv.firstElementChild;
            currentSegment.after(newSegmentElement);
            
            // Update data array - insert new segment at correct position
            // First ensure parsedTextsData has enough elements
            while (parsedTextsData.length <= newSegmentIndex) {
                parsedTextsData.push({ text: '' });
            }
            parsedTextsData.splice(newSegmentIndex, 0, { text: afterText });
            
            // Update the segment at the split index
            updateParsedSegment(segmentIndex, beforeText);
            
            // Relabel all segments after the split; then resize so both new segments have height that fits content
            relabelSegments();
            scheduleResizeSegmentEditorsAfterLayout();
            enableExportParsed();
        }
        
        function relabelSegments() {
            // Update all segment numbers and data-segment-index attributes
            const segments = document.querySelectorAll('.rated-segment');
            segments.forEach((segment, idx) => {
                // Update data-segment-index
                segment.setAttribute('data-segment-index', idx);
                
                // Update segment number display
                const numberSpan = segment.querySelector('.rated-segment-number');
                if (numberSpan) {
                    numberSpan.textContent = `Segment ${idx + 1}`;
                }
                
                // Update editor data-segment-index
                const editor = segment.querySelector('.parsed-segment-editor');
                if (editor) {
                    editor.setAttribute('data-segment-index', idx);
                    editor.setAttribute('onchange', `updateParsedSegment(${idx}, this.value); enableExportParsed();`);
                    editor.setAttribute('oninput', 'resizeSegmentEditor(this); enableExportParsed();');
                    editor.setAttribute('onkeydown', `handleSegmentKeydown(event, ${idx})`);
                }
                
                // Update merge button
                const mergeButton = segment.querySelector('.merge-button');
                if (mergeButton) {
                    if (idx > 0) {
                        mergeButton.setAttribute('onclick', `mergeWithPrevious(${idx})`);
                        mergeButton.style.display = 'inline-block';
                    } else {
                        mergeButton.style.display = 'none';
                    }
                }
                
                // Update split button
                const splitButton = segment.querySelector('.split-button');
                if (splitButton) {
                    splitButton.setAttribute('onclick', `splitSegmentAtCursor(${idx})`);
                }
            });
            resizeAllSegmentEditors();
        }
        
        function mergeWithPrevious(segmentIndex) {
            if (segmentIndex <= 0) return;
            
            const currentEditor = document.querySelector(`.parsed-segment-editor[data-segment-index="${segmentIndex}"]`);
            const previousEditor = document.querySelector(`.parsed-segment-editor[data-segment-index="${segmentIndex - 1}"]`);
            
            if (currentEditor && previousEditor) {
                const currentText = currentEditor.value.trim();
                const previousText = previousEditor.value.trim();
                
                // Combine texts with a space
                const mergedText = previousText + ' ' + currentText;
                previousEditor.value = mergedText;
                
                // Update data
                updateParsedSegment(segmentIndex - 1, mergedText);
                
                // Remove current segment from DOM
                const currentSegment = document.querySelector(`.rated-segment[data-segment-index="${segmentIndex}"]`);
                if (currentSegment) {
                    currentSegment.remove();
                }
                
                // Remove from data array
                parsedTextsData.splice(segmentIndex, 1);
                
                // Relabel all segments after merge; resize so merged segment box fits new content
                relabelSegments();
                scheduleResizeSegmentEditorsAfterLayout();
                enableExportParsed();
            }
        }

        async function loadSubjectData() {
            try {
                const apiPrefix = isStory ? '/api/story' : '/api/subject';
                let url = `${apiPrefix}/${subjectId}`;
                const params = new URLSearchParams();
                if (currentStoryTranscriptFile) params.set('story_transcript_file', currentStoryTranscriptFile);
                if (currentStoryEventsFile) params.set('story_events_file', currentStoryEventsFile);
                if (currentRecallFileVersion) params.set('recall_file_version', currentRecallFileVersion);
                if (currentCausalRatingFile) params.set('causal_rating_file', currentCausalRatingFile);
                const qs = params.toString();
                if (qs) url += '?' + qs;
                
                const response = await fetch(url);
                const data = await response.json();
                
                rawText = data.raw_recall || '';
                correctedText = data.corrected_text || '';
                ratedTextsData = data.rated_texts || [];
                parsedTextsData = data.parsed_texts || [];
                storyEventsData = data.story_events || [];
                originalStoryEvents = (data.story_events || []).map(e => (e.text || '').trim());
                originalCorrectedText = (data.corrected_text || '').trim();
                originalAudioTranscription = (data.audio_transcription || '').trim();
                originalParsedTexts = (data.parsed_texts || []).map(s => (s.text || '').trim());
                const ratedOrParsed = (data.rated_texts && data.rated_texts.length) ? data.rated_texts : (data.parsed_texts || []);
                originalRatedEvents = ratedOrParsed.map(s => parseEventValue((s.matched_event != null ? String(s.matched_event) : (s.matched != null ? String(s.matched) : ''))));
                originalGistLevels = ratedOrParsed.map(s => (s.gist_level || 'NA'));
                
                if (data.available_versions) {
                    availableVersions = data.available_versions;
                }
                window._defaultExportPaths = data.default_export_paths || {};
                window._currentUsername = data.username || currentUsername || 'human';
                
                renderContent(data);
                populatePanelVersionSelects();
                // Initialize the bar-based segmenters from the freshly loaded data.
                initSegmenter('story');
                initSegmenter('recall');
                // Kick off the page tutorial once the panels exist. setupSubjectTutorial()
                // is idempotent (autoStart re-installs the toggle without duplicating it).
                setTimeout(setupSubjectTutorial, 400);

                // Show notification if initial tab has one; resize segment editors to fit content after layout
                const initialTab = getInitialTab();
                setTimeout(() => {
                    scheduleResizeSegmentEditorsAfterLayout();
                    initRecallMatchingDragDrop();
                    initRecallMatchingClickSelect();
                    refreshRecallMatchingUsedEventsFade();
                    if (initialTab === 'story-events') {
                        showNotification('story-events-notification', 'story-events-notification-dismissed');
                    } else if (initialTab === 'raw-processed') {
                        showNotification('raw-processed-notification', 'raw-processed-notification-dismissed');
                    } else if (initialTab === 'segmented') {
                        showNotification('segmented-notification', 'segmented-notification-dismissed');
                    } else if (initialTab === 'matched') {
                        showNotification('matched-notification', 'matched-notification-dismissed');
                    }
                }, 100);
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    `<div class="error">Error loading subject data: ${error.message}</div>`;
            }
        }
        
        if (!window._panelVersionChangeBound) {
            window._panelVersionChangeBound = true;
            document.addEventListener('change', function(ev) {
                const t = ev.target;
                const sel = t && t.closest ? t.closest('.panel-version-select') : null;
                if (!sel) return;
                const role = sel.getAttribute('data-role');
                if (role === 'story-transcript') {
                    currentStoryTranscriptFile = sel.value || null;
                    loadSubjectData();
                } else if (role === 'story-events') {
                    currentStoryEventsFile = sel.value || null;
                    loadSubjectData();
                } else if (role === 'recall-pipeline') {
                    currentRecallFileVersion = sel.value || null;
                    loadSubjectData();
                } else if (role === 'causal-rating-file') {
                    currentCausalRatingFile = sel.value || null;
                    loadSubjectData();
                }
            });
        }
        
        loadSubjectData();

        // Per-tab tutorial registry for the inspection page. Each pipeline-step
        // tab (story-events, segmented, matched, causal-matrix, raw-processed,
        // audio-transcription) gets its own walkthrough — and its own
        // localStorage completion flag — so a first-time visit to *any* tab
        // re-runs the walk for that tab specifically. Switching tabs while the
        // tutorial is closed will silently start the next tab's walk if the
        // user hasn't seen it yet; the top-right (?) icon always restarts the
        // tutorial for the currently-active tab.
        var SUBJECT_TAB_TUTORIALS = {
            'story-events': function () {
                return [
                    {
                        target: '#story-events .rated-panel',
                        title: 'Story segments — main panel',
                        body: 'This right-side panel is where you edit the <strong>story segmentation</strong>. ' +
                              'Each box is one story event; the panel shows the segments as they\'ll be exported.',
                        placement: 'left'
                    },
                    {
                        target: '#story-events .seg-flow[data-panel="story"]',
                        title: 'Click to add / remove a boundary',
                        body: 'Move your cursor through the text — a red bar follows it between words. ' +
                              '<strong>Click</strong> at the position to drop a new segment boundary (the text after it ' +
                              'reflows into a new box). Click an existing red bar to remove it.',
                        placement: 'auto'
                    },
                    {
                        target: '#story-events .seg-mode-toggle',
                        title: 'Optional: 1–5 boundary strength',
                        body: 'Switch from <strong>binary</strong> to <strong>1–5</strong> to rate how strong each ' +
                              'boundary is. In 1–5 mode, clicking a boundary opens a picker (1 = weak → 5 = strong); ' +
                              'the bar color reflects the strength and is written to a <code>boundary_strength</code> column on export.',
                        placement: 'left'
                    },
                    {
                        target: '#story-events .story-panel',
                        title: 'Story text — reference (left panel)',
                        body: 'This is the raw story transcript for your reference. It is read-only — ' +
                              'just there so you can see the full story while editing segments on the right.',
                        placement: 'right'
                    },
                    {
                        target: '#export-story-events',
                        title: 'Export your edits',
                        body: 'When the segments look right, click <strong>Export Edited File</strong> to save ' +
                              'your version. The original automated output is never overwritten — your edits ' +
                              'land under <code>output/</code> tagged with your rater name.',
                        placement: 'top'
                    }
                ];
            },
            'segmented': function () {
                return [
                    {
                        target: '#segmented .rated-panel',
                        title: 'Recall segments — main panel',
                        body: 'This right-side panel is the <strong>recall parsing</strong> work area. Each box ' +
                              'is one segmented recall clause as it\'ll be exported.',
                        placement: 'left'
                    },
                    {
                        target: '#segmented .seg-flow[data-panel="recall"]',
                        title: 'Click to add / remove a boundary',
                        body: 'Move the cursor through the text — a red bar follows between words. ' +
                              '<strong>Click</strong> to drop a new boundary; click an existing red bar to remove it.',
                        placement: 'auto'
                    },
                    {
                        target: '#segmented .seg-mode-toggle',
                        title: 'Optional: 1–5 boundary strength',
                        body: 'Toggle to <strong>1–5</strong> mode to rate each boundary\'s strength ' +
                              '(1 = weak → 5 = strong). The rating is exported as a <code>boundary_strength</code> column.',
                        placement: 'left'
                    },
                    {
                        target: '#segmented .story-panel',
                        title: 'Corrected recall (reference)',
                        body: 'Read-only view of the corrected recall text — the source you are segmenting. ' +
                              'Edits happen on the right.',
                        placement: 'right'
                    },
                    {
                        target: '#export-parsed',
                        title: 'Export your edits',
                        body: 'Save your segmentation with <strong>Export Edited File</strong> — your version ' +
                              'goes under <code>output/</code> tagged with your rater name.',
                        placement: 'top'
                    }
                ];
            },
            'matched': function () {
                return [
                    {
                        target: '#matched .story-panel',
                        title: 'Story events (left)',
                        body: 'The list of story events that a recall segment may refer to. ' +
                              'Once you\'ve selected a recall segment on the right, click any event here ' +
                              'to add it to that segment\'s match — click again to remove it.',
                        placement: 'right'
                    },
                    {
                        target: '#matched .rated-panel',
                        title: 'Parsed recall segments (right)',
                        body: 'Your recall, broken into segments. <strong>Click a recall segment</strong> on this ' +
                              'side to select it — it stays highlighted — then <strong>click the story event(s) ' +
                              'on the left</strong> that this segment refers to. Click the segment again to ' +
                              'deselect. You can also type event numbers directly (e.g. <code>1, 2, 3</code>) ' +
                              'into each segment\'s Event input.',
                        placement: 'left'
                    },
                    {
                        target: '#export-rated',
                        title: 'Export the matches',
                        body: 'Once you\'ve matched everything you want, click <strong>Export Edited File</strong>. ' +
                              'The exported file pairs each recall segment with its matched story event id(s).',
                        placement: 'top'
                    }
                ];
            },
            'causal-matrix': function () {
                return [
                    {
                        target: '#causal-matrix .causal-matrix-instructions',
                        title: 'How to rate (read me first)',
                        body: 'A quick refresher: click a cell to pick a rating <strong>1 / 2 / 3</strong>; leave ' +
                              '0 for unrelated pairs; use <strong>×</strong> to wipe a cell. With the optional ' +
                              'Reasoning / Causal Type / Semantic checkboxes on, every click also opens a prompt ' +
                              'prefilled with your previous answers.',
                        placement: 'auto'
                    },
                    {
                        target: '#causal-matrix .causal-matrix-wrapper',
                        title: 'The causal matrix (main panel)',
                        body: 'Each cell is one <em>cause</em> (column) × <em>effect</em> (row) pair. <strong>Hover</strong> ' +
                              'to see the cause/effect texts; <strong>click</strong> a cell to rate it.',
                        placement: 'left'
                    },
                    {
                        target: '#causal-matrix .causal-events-panel',
                        title: 'Story events (reference)',
                        body: 'List of all story events with their text — useful for context while rating. ' +
                              'Click an event to filter the matrix by that cause column.',
                        placement: 'right'
                    },
                    {
                        target: '#causal-matrix .causal-flags-bar',
                        title: 'Optional fields',
                        body: 'Turn on Reasoning / Causal Type / Semantic to be prompted for those after each rating. ' +
                              'See the instructions above for keyboard shortcuts.',
                        placement: 'bottom'
                    },
                    {
                        target: '#export-causal-matrix',
                        title: 'Export the matrix',
                        body: 'Saves only the pairs with rating > 0 (plus any qualitative columns you enabled). ' +
                              'The destination folder just needs to exist — no preexisting file required.',
                        placement: 'top'
                    }
                ];
            },
            'raw-processed': function () {
                return [
                    {
                        target: '#raw-processed .side-by-side-panel:first-child',
                        title: 'Raw recall (left)',
                        body: 'The original raw recall text exactly as it came in — for reference only.',
                        placement: 'right'
                    },
                    {
                        target: '#raw-processed .side-by-side-panel:last-child',
                        title: 'Corrected recall (right, editable)',
                        body: 'The auto-corrected version. Type directly here to fine-tune the corrections; ' +
                              'the spell/grammar step makes only minimal edits and may miss things — your ' +
                              'edits are saved with your rater name on export.',
                        placement: 'left'
                    },
                    {
                        target: '#export-corrected',
                        title: 'Export your edits',
                        body: 'Save your hand-corrected version as a new file under <code>output/</code>.',
                        placement: 'top'
                    }
                ];
            },
            'audio-transcription': function () {
                return [
                    {
                        target: '#audio-transcription .side-by-side-panel:first-child',
                        title: 'Audio + auto-transcription (left)',
                        body: 'Play the audio with the player at the top; the read-only transcription below ' +
                              'highlights the word at the audio cursor so you can follow along.',
                        placement: 'right'
                    },
                    {
                        target: '#audio-transcription-editor',
                        title: 'Editable transcription (right)',
                        body: 'Type here to fix what the auto-transcription got wrong. Clicking inside the text ' +
                              'jumps the audio cursor to that word so you can re-listen as you edit.',
                        placement: 'left'
                    },
                    {
                        target: '#export-audio',
                        title: 'Export your transcription',
                        body: 'Saves your corrected transcription under <code>output/</code> with your rater name.',
                        placement: 'top'
                    }
                ];
            }
        };

        // Detect which inspection tab is currently active and return its id; or
        // 'subject-inspection' as a generic fallback if nothing is active yet.
        function _currentSubjectTabKey() {
            var active = document.querySelector('.tab-content.active');
            return (active && active.id) || 'subject-inspection';
        }

        // Build a fresh step list for the currently-active tab. The fns in
        // SUBJECT_TAB_TUTORIALS are called at run time so selectors that depend
        // on per-data-load IDs always match the live DOM.
        function _currentSubjectTabSteps() {
            var key = _currentSubjectTabKey();
            var factory = SUBJECT_TAB_TUTORIALS[key];
            return factory ? factory() : [];
        }

        // Install the (?) toggle once and start the current tab's walkthrough if
        // the user hasn't already completed it. Re-invoking is safe — installToggle
        // replaces the old icon and start() teardown+rebuild keeps state clean.
        function setupSubjectTutorial() {
            if (!window.Tutorial) return;
            var tabKey = _currentSubjectTabKey();
            var pageKey = 'subject:' + tabKey;
            var steps = _currentSubjectTabSteps();
            // Always install the toggle so the user has a manual restart, even
            // for tabs we haven't defined steps for (it'll just be inert).
            window.Tutorial.installToggle(pageKey, { steps: steps, right: '70px' });
            if (steps.length && !window.Tutorial.isCompleted(pageKey)) {
                requestAnimationFrame(function () { window.Tutorial.start(pageKey, steps); });
            }
        }

        // Tab switches retarget the tutorial: stop the current walk (without
        // marking the old tab completed — switching away mid-tour shouldn't
        // count as "I learned this"), then run setupSubjectTutorial again so
        // the (?) icon and auto-start now reflect the new tab.
        (function () {
            var origShowTab = window.showTab;
            if (typeof origShowTab === 'function') {
                window.showTab = function (tabName) {
                    var result = origShowTab.apply(this, arguments);
                    // Defer one frame so the new tab content (and any per-tab
                    // initialization in origShowTab) has rendered.
                    requestAnimationFrame(function () {
                        if (window.Tutorial) window.Tutorial.stop(false);
                        setupSubjectTutorial();
                    });
                    return result;
                };
            }
        })();

        let selectedTheme = null;
        
        // Settings Modal Functions
        function openSettings() {
            document.getElementById('settings-modal').classList.add('show');
            // Update radio buttons to reflect current theme
            const currentTheme = window.ThemeManager ? window.ThemeManager.getCurrentTheme() : 'dark';
            document.getElementById('theme-dark').checked = (currentTheme === 'dark');
            document.getElementById('theme-day').checked = (currentTheme === 'day');
            selectedTheme = currentTheme; // Initialize selectedTheme to current theme
        }
        
        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('show');
        }
        
        function closeSettingsOnBackdrop(event) {
            if (event.target.id === 'settings-modal') {
                closeSettings();
            }
        }
        
        function selectThemeOption(theme) {
            document.getElementById('theme-dark').checked = (theme === 'dark');
            document.getElementById('theme-day').checked = (theme === 'day');
            selectedTheme = theme;
            if (window.ThemeManager) window.ThemeManager.switchTheme(theme);
        }
        
        function confirmSettings() {
            if (selectedTheme && window.ThemeManager) {
                window.ThemeManager.switchTheme(selectedTheme);
            }
            closeSettings();
        }
        
        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettings();
            }
        });
    </script>
</body>
</html>
