<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File: {{ subject_id }} - narRater</title>
    <script src="/static/theme-manager.js"></script>
    <script src="/static/tutorial.js"></script>
    <style>
        :root {
            --bg0: #0b0d14;
            --bg1: #111527;
            --bg2: #1a1f36;
            --bg3: #242b4a;
            --t0: #f0f2f5;
            --t1: #c4c9db;
            --t2: #8890a8;
            --t3: #5c6380;
            --bdr: #2a3050;
            --bdr2: #353c60;
            --acc: #6c63ff;
            --acc2: #8b84ff;
            --accbg: rgba(108, 99, 255, 0.12);
            --red: #ef4444;
            --grn: #22c55e;
            --ylw: #f59e0b;
            --rad: 10px;
            --tr: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.5);
            --overlay: rgba(0, 0, 0, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* The inspection page is denser than the dashboard/pipeline, so default it one
           step more compact (0.8 vs 0.9 elsewhere) — i.e. how it looks after one
           browser Cmd/Ctrl + - press. The segmentation cursor bar is positioned in
           layout (offsetLeft/offsetTop) space rather than viewport space, so it stays
           aligned with the pointer at this zoom (see positionSegCursorBar). Users can
           still change the browser zoom themselves. */
        html {
            zoom: 0.8;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg0);
            color: var(--t0);
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--bg1);
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            color: var(--t0);
            /* Extra right padding so the "Back to Subjects" link (which sits at
               the header's right edge via justify-content: space-between) clears
               the two top-right fixed icons (settings ⚙️ at right:20px, tutorial
               ? at right:70px with its "tutorial" caption underneath). */
            padding: 10px 130px 10px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        
        .header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            flex-shrink: 0;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .back-link {
            color: var(--t0);
            text-decoration: none;
            opacity: 0.9;
            display: inline-block;
            padding: 6px 14px;
            background: var(--bg2);
            border: 1px solid var(--bdr);
            border-radius: 6px;
            font-size: 0.9em;
            transition: all var(--tr);
        }
        
        .back-link:hover {
            background: var(--bg3);
            border-color: var(--acc);
            opacity: 1;
            transform: translateY(-2px);
        }
        
        .section {
            background: var(--bg1);
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }
        
        .section h2 {
            color: var(--acc);
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid var(--acc);
            padding-bottom: 10px;
        }
        
        .text-content {
            background: var(--bg2);
            border: 1px solid var(--bdr);
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid var(--acc);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1.05em;
            line-height: 1.8;
            color: var(--t1);
        }
        
        .text-content.empty {
            color: var(--t3);
            font-style: italic;
        }
        
        .segments-container {
            display: grid;
            gap: 15px;
        }
        
        .segment {
            background: var(--bg2);
            border: 1px solid var(--bdr);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 4px solid var(--acc);
            transition: all var(--tr);
        }
        
        .segment:hover {
            background: var(--bg3);
            border-color: var(--acc);
            transform: translateX(5px);
        }
        
        .segment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .segment-number {
            font-weight: bold;
            color: var(--acc);
            font-size: 0.9em;
        }
        
        .matched-events {
            background: var(--grn);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .matched-events.empty {
            background: var(--t3);
        }
        
        .segment-text {
            color: var(--t1);
            line-height: 1.45;
        }
        
        .story-events-container {
            display: grid;
            gap: 15px;
        }
        
        .story-event {
            background: var(--accbg);
            border: 1px solid var(--bdr);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 4px solid var(--ylw);
            cursor: grab;
        }
        
        #matched .story-event[draggable="true"]:active {
            cursor: grabbing;
        }
        
        /* Story events that have already received a recall-match drop are
           marked "used". Keep the dim very faint so used events stay
           legible and visually close to the unused ones — the user is still
           working with them. (Was: opacity 0.42 + saturate 0.55, which made
           used events recede into the background and hard to read.) */
        #matched .story-event.story-event-used {
            opacity: 0.88;
        }
        
        #matched .rated-segment.recall-match-drop-hover {
            outline: 2px dashed var(--ylw);
            outline-offset: 2px;
            border-radius: 6px;
        }
        
        .story-event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .event-number {
            background: var(--ylw);
            color: var(--bg0);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
        }
        
        .event-text {
            color: var(--t1);
            line-height: 1.45;
            text-align: left;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--t2);
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--bdr);
        }
        
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1em;
            color: var(--t2);
            border-bottom: 3px solid transparent;
            transition: all var(--tr);
            font-weight: 500;
        }
        
        .tab:hover {
            color: var(--acc);
            background: var(--bg2);
        }
        
        .tab.active {
            color: var(--acc);
            border-bottom-color: var(--acc);
            font-weight: 600;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .side-by-side-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            height: calc(100vh - 200px);
            min-height: 500px;
        }
        
        .side-by-side-panel {
            flex: 1;
            background: var(--bg1);
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            padding: 25px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .side-by-side-container .side-by-side-panel:nth-child(2) {
            box-shadow: var(--shadow), 0 0 28px rgba(245, 158, 11, 0.22), 0 0 56px rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.35);
        }
        
        .side-by-side-panel h2 {
            color: var(--acc);
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid var(--acc);
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        
        .text-display {
            background: var(--bg2);
            border: 1px solid var(--bdr);
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid var(--acc);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1.05em;
            line-height: 1.8;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            cursor: text;
            user-select: text;
            color: var(--t1);
        }
        
        .text-display.empty {
            color: var(--t3);
            font-style: italic;
        }
        
        .text-display .highlight {
            background-color: var(--ylw);
            padding: 2px 0;
            transition: background-color 0.3s ease;
        }
        
        .text-display .highlight.active {
            background-color: var(--acc);
        }
        
        .text-editor {
            background: var(--bg2);
            border: 1.5px solid var(--bdr);
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid var(--grn);
            font-size: 1.05em;
            line-height: 1.8;
            flex: 1;
            resize: none;
            font-family: inherit;
            transition: all var(--tr);
            min-height: 0;
            overflow-y: auto;
            color: var(--t0);
        }
        
        .text-editor:focus {
            outline: none;
            border-color: var(--grn);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
        }
        
        .text-editor.empty {
            color: var(--t3);
            font-style: italic;
        }
        
        .processed-changed {
            color: var(--red);
            font-weight: 500;
        }
        
        .corrected-text-editable {
            background: var(--bg2);
            border: 1.5px solid var(--bdr);
            border-left: 4px solid var(--grn);
            padding: 20px;
            border-radius: 6px;
            font-size: 1.05em;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 200px;
            overflow-y: auto;
            color: var(--t1);
            outline: none;
        }
        
        .corrected-text-editable:focus {
            border-color: var(--grn);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
        }
        
        .corrected-text-editable.empty {
            color: var(--t3);
            font-style: italic;
        }
        
        .export-button {
            background: var(--grn);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all var(--tr);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            width: 100%;
        }
        
        .export-button:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        
        .export-button:active {
            transform: translateY(0);
        }
        
        .export-button:disabled {
            background: var(--bdr2);
            color: var(--t3);
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .export-button:disabled:hover {
            background: var(--bdr2);
            color: var(--t3);
            transform: none;
            box-shadow: none;
        }
        
        .save-status {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9em;
            display: none;
            flex-shrink: 0;
        }
        
        .save-status.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--grn);
            color: var(--grn);
            display: block;
        }
        
        .save-status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--red);
            color: var(--red);
            display: block;
        }
        
        .export-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .export-modal-overlay.show {
            display: flex;
        }
        .export-modal {
            background: var(--bg1);
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            box-shadow: var(--shadow-modal);
            padding: 24px;
            max-width: 560px;
            width: 100%;
        }
        .export-modal h3 {
            margin: 0 0 16px 0;
            font-size: 1.1em;
        }
        .export-modal label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: var(--t2);
        }
        .export-modal input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg2);
            border: 1px solid var(--bdr);
            border-radius: 6px;
            color: var(--t0);
            font-family: inherit;
            font-size: 0.95em;
            margin-bottom: 16px;
        }
        .export-modal input[type="text"]:focus {
            outline: none;
            border-color: var(--acc);
        }
        .export-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .export-modal-actions button {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .export-modal-cancel {
            background: var(--bg3);
            color: var(--t1);
        }
        .export-modal-confirm {
            background: var(--grn);
            color: white;
        }
        
        .causal-tab-layout {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            min-height: 500px;
        }
        
        .causal-matrix-instructions {
            background: var(--bg2);
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 0.82em;
            color: var(--t1);
            line-height: 1.5;
            flex-shrink: 0;
        }
        
        .causal-matrix-instructions strong { color: var(--acc2); }
        
        .causal-flags-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            padding: 8px 14px;
            background: var(--bg2);
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            margin-bottom: 10px;
            font-size: 0.82em;
            flex-shrink: 0;
        }
        
        .causal-flags-bar label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: var(--t1);
            white-space: nowrap;
        }
        
        .causal-flags-bar input[type="checkbox"] {
            accent-color: var(--acc);
            cursor: pointer;
        }
        
        .causal-body {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        
        .causal-events-panel {
            width: 300px;
            min-width: 200px;
            max-width: 70%;
            flex-shrink: 0;
            overflow-y: auto;
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            background: var(--bg2);
            padding: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .causal-events-panel-resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: col-resize;
            z-index: 10;
        }
        .causal-events-panel-resize-handle:hover,
        .causal-events-panel-resize-handle.resizing {
            background: rgba(96, 165, 250, 0.25);
        }
        .causal-lines-toggle-bar {
            flex-shrink: 0;
            margin-bottom: 8px;
        }
        .causal-lines-toggle-bar select {
            font-size: 0.75em;
            padding: 4px 6px;
            background: var(--bg1);
            border: 1px solid var(--bdr);
            border-radius: 4px;
            color: var(--t1);
        }
        .causal-events-inner {
            position: relative;
            flex: 1;
            min-height: min-content;
        }
        .causal-lines-svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 60px;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .causal-events-list {
            margin-left: 64px;
            position: relative;
            z-index: 2;
        }
        .causal-body:has(.nested-coarse-view) .causal-events-panel {
            flex: 1 1 300px;
            min-width: 260px;
            max-width: 400px;
        }
        
        .causal-event-item {
            padding: 8px 10px;
            margin-bottom: 6px;
            background: var(--bg1);
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 0.82em;
            line-height: 1.5;
            text-align: left;
            color: var(--t1);
            transition: border-color 0.15s, background 0.15s;
        }
        
        .causal-event-item .ce-num {
            font-weight: 700;
            color: var(--t2);
            font-size: 0.85em;
            margin-bottom: 2px;
        }
        
        .causal-event-item.highlight-cause {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.12);
        }
        
        .causal-event-item.highlight-cause .ce-num { color: #60a5fa; }
        
        .causal-event-item.highlight-effect {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.12);
        }
        .causal-event-item.cause-filter-active {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.2);
            box-shadow: 0 0 0 2px #60a5fa;
        }
        .causal-event-item.effect-filter-active {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.2);
            box-shadow: 0 0 0 2px #f87171;
        }
        .causal-matrix-cell.causal-cell-dimmed {
            opacity: 0.35;
            pointer-events: none;
        }
        .causal-matrix-wrapper.cause-column-active .causal-matrix-cell:not(.diagonal):not(.causal-cell-dimmed) {
            background: rgba(96, 165, 250, 0.15);
            box-shadow: inset 0 0 12px rgba(96, 165, 250, 0.25);
            outline: 2px solid rgba(96, 165, 250, 0.6);
            outline-offset: -1px;
        }
        .causal-matrix-wrapper.cause-column-active .causal-matrix-cell:not(.diagonal):not(.causal-cell-dimmed):hover {
            background: rgba(248, 113, 113, 0.2);
            box-shadow: inset 0 0 14px rgba(248, 113, 113, 0.4);
            outline: 2px solid rgba(248, 113, 113, 0.8);
        }
        
        .causal-event-item.highlight-effect .ce-num { color: #f87171; }
        
        .causal-matrix-wrapper {
            flex: 1;
            min-width: 0;
            overflow: auto;
            border: 1px solid var(--bdr);
            border-radius: var(--rad);
            background: var(--bg2);
            position: relative;
        }
        .causal-events-panel > .panel-version-bar {
            border-bottom-color: var(--bdr);
            margin-bottom: 10px;
            padding-bottom: 10px;
        }
        /* Level 1 nested: square matrix stretching to fill entire main space */
        .causal-matrix-wrapper.nested-coarse-view {
            display: flex;
            align-items: center;
            justify-content: center;
            container-type: size;
        }
        .causal-matrix-wrapper.nested-coarse-view .causal-matrix-table {
            width: min(100cqw, 100cqh);
            height: min(100cqw, 100cqh);
            table-layout: fixed;
        }
        .causal-matrix-wrapper.nested-coarse-view .causal-matrix-table th,
        .causal-matrix-wrapper.nested-coarse-view .causal-matrix-table td {
            aspect-ratio: 1;
            min-width: 38px;
        }
        
        .causal-matrix-table {
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .causal-matrix-table th,
        .causal-matrix-table td {
            border: 1px solid var(--bdr);
            text-align: center;
            font-size: 0.75em;
        }
        
        .causal-matrix-table th {
            background: var(--bg3);
            color: var(--t1);
            font-weight: 600;
            position: sticky;
            z-index: 2;
            padding: 0;
        }
        
        .causal-matrix-table thead th {
            top: 0;
            z-index: 3;
            min-width: 38px;
            max-width: 38px;
            height: 38px;
        }
        
        .causal-matrix-table thead th:first-child {
            left: 0;
            z-index: 4;
            min-width: 42px;
            max-width: 42px;
        }
        
        .causal-matrix-table tbody th {
            left: 0;
            z-index: 2;
            min-width: 42px;
            max-width: 42px;
            height: 38px;
            text-align: right;
            padding-right: 6px;
        }
        
        .causal-matrix-cell {
            width: 38px;
            height: 38px;
            min-width: 38px;
            max-width: 38px;
            padding: 0;
            cursor: pointer;
            transition: background 0.1s;
            position: relative;
            color: var(--t2);
            font-weight: 600;
            font-size: 0.95em;
            user-select: none;
        }
        
        .causal-matrix-cell:hover {
            outline: 2px solid var(--acc);
            outline-offset: -2px;
            z-index: 1;
        }
        
        .causal-matrix-cell.rating-0 { background: var(--bg2); color: var(--t3); }
        .causal-matrix-cell.rating-1 { background: rgba(96, 165, 250, 0.25); color: #93c5fd; }
        .causal-matrix-cell.rating-2 { background: rgba(251, 191, 36, 0.3); color: #fbbf24; }
        .causal-matrix-cell.rating-3 { background: rgba(239, 68, 68, 0.35); color: #fca5a5; }
        
        .causal-matrix-cell.has-reasoning {
            box-shadow: inset 0 0 0 2px var(--t0);
        }
        
        .causal-matrix-cell.diagonal { background: var(--bg1); cursor: default; }
        .causal-matrix-cell.diagonal:hover { outline: none; }
        
        .causal-hover-top,

           from `event.clientX/Y` and the line's getBoundingClientRect — same
           coordinate space, no conversion math, no drift.

           every frame, not slide toward where the pointer was. rAF throttling
           in JS already gives us 60 fps which is plenty smooth. */

               the bar never lags behind the pointer. */

    <script>
    (function(){
        var KEY='narrative-processor-theme';
        var dark={'--bg0':'#0b0d14','--bg1':'#111527','--bg2':'#1a1f36','--bg3':'#242b4a','--t0':'#f0f2f5','--t1':'#c4c9db','--t2':'#8890a8','--t3':'#5c6380','--bdr':'#2a3050','--bdr2':'#353c60','--acc':'#6c63ff','--acc2':'#8b84ff','--accbg':'rgba(108, 99, 255, 0.12)','--red':'#ef4444','--grn':'#22c55e','--ylw':'#f59e0b','--shadow':'0 20px 60px rgba(0, 0, 0, 0.4)','--shadow-sm':'0 2px 8px rgba(0, 0, 0, 0.2)','--shadow-modal':'0 20px 60px rgba(0, 0, 0, 0.5)','--overlay':'rgba(0, 0, 0, 0.5)'};
        var day={'--bg0':'#ffffff','--bg1':'rgba(0, 0, 0, 0.04)','--bg2':'rgba(0, 0, 0, 0.08)','--bg3':'rgba(0, 0, 0, 0.12)','--t0':'#0d0d0d','--t1':'#1a1a1a','--t2':'#333333','--t3':'#525252','--bdr':'rgba(0, 0, 0, 0.12)','--bdr2':'rgba(0, 0, 0, 0.18)','--acc':'#6c63ff','--acc2':'#8b84ff','--accbg':'rgba(108, 99, 255, 0.12)','--red':'#ef4444','--grn':'#22c55e','--ylw':'#f59e0b','--shadow':'0 4px 20px rgba(0, 0, 0, 0.08)','--shadow-sm':'0 2px 8px rgba(0, 0, 0, 0.08)','--shadow-modal':'0 20px 50px rgba(0, 0, 0, 0.12)','--overlay':'rgba(0, 0, 0, 0.25)'};
        function apply(theme){
            var colors=theme==='day'?day:dark;
            var root=document.documentElement;
            root.setAttribute('data-theme',theme);
            var old=document.getElementById('theme-override');
            if(old)old.remove();
            var s=document.createElement('style');s.id='theme-override';
            var css='html[data-theme="'+theme+'"]{';
            for(var k in colors)css+=k+':'+colors[k]+' !important; ';

            if(dr)dr.checked=(theme==='dark');if(dy)dy.checked=(theme==='day');

        Loading subject data...
    </div>
    
    <div id="export-modal-overlay" class="export-modal-overlay">
        <div class="export-modal" onclick="event.stopPropagation()">
            <h3>Export File</h3>
            <label for="export-path-input">Output path (relative to project root)</label>
            <input type="text" id="export-path-input" placeholder="e.g. output/recall_corrected/subject-edit.txt" />
            <div class="export-modal-actions">
                <button type="button" class="export-modal-cancel" id="export-modal-cancel">Cancel</button>
                <button type="button" class="export-modal-confirm" id="export-modal-confirm">Save</button>
            </div>
        </div>
    </div>
    
    <script>
        const subjectId = '{{ subject_id }}';
        const stepParam = '{{ step|default("") }}'.trim();
        const isStory = {{ 'true' if is_story else 'false' }};
        const currentUsername = {{ (logged_in_username or "human")|tojson }};
        let rawText = '';
        let correctedText = '';
        let rawTextElement = null;
        let correctedTextElement = null;
        
        let panelSteps = null;
        try {
            var raw = sessionStorage.getItem('dashboard_panel_steps');
            if (raw) panelSteps = JSON.parse(raw);
        } catch (e) {}
        function stepInPanel(stepNames) {
            if (!panelSteps || !panelSteps.length) return true;
            // Deep-linked inspect URL (/subject/.../step2): always allow that step's tabs even if
            // sessionStorage panel order is stale or from another pipeline.
            if (stepParam && stepNames.indexOf(stepParam) >= 0) return true;
            return stepNames.some(function(s) { return panelSteps.indexOf(s) >= 0; });
        }
        
        /** Keep Story Segments immediately before Parsed Recall / Recall Matching for inspection. */
        function placeStorySegmentsBeforeRecall(tabs) {
            if (!tabs || !tabs.length) return tabs;
            const storyIdx = tabs.findIndex(function(t) { return t.id === 'story-events'; });
            if (storyIdx < 0) return tabs;
            const storyTab = tabs[storyIdx];
            const rest = tabs.filter(function(t) { return t.id !== 'story-events'; });
            const segIdx = rest.findIndex(function(t) { return t.id === 'segmented'; });
            const matIdx = rest.findIndex(function(t) { return t.id === 'matched'; });
            var insertAt = rest.length;
            if (segIdx >= 0) insertAt = segIdx;
            else if (matIdx >= 0) insertAt = matIdx;
            return rest.slice(0, insertAt).concat([storyTab], rest.slice(insertAt));
        }
        
        /**
         * Add-on tabs (e.g. Story Segments shown only for recall parse/match context) go first.
         * Otherwise keep Story Segments immediately before Parsed Recall / Recall Matching.
         */
        function orderInspectionTabs(tabs, storySegmentsAddon) {
            if (!tabs || !tabs.length) return tabs;
            const storyIdx = tabs.findIndex(function(t) { return t.id === 'story-events'; });
            if (storyIdx < 0) return tabs;
            if (storySegmentsAddon) {
                const storyTab = tabs[storyIdx];
                const rest = tabs.filter(function(t) { return t.id !== 'story-events'; });
                return [storyTab].concat(rest);
            }
            return placeStorySegmentsBeforeRecall(tabs);
        }
        
        function getInitialTab() {
            if (stepParam === 'step0') return 'story-events';
            if (stepParam === 'step0_audio') return 'audio-transcription';
            if (stepParam === 'step0_story_audio') return 'audio-transcription';
            if (stepParam === 'step0_causal') return 'causal-matrix';
            if (stepParam === 'step1') return 'raw-processed';
            if (stepParam === 'step2') return 'segmented';
            if (stepParam === 'step3') return 'matched';
            return 'raw-processed';
        }
        
        function panelVersionBarMarkup(label, role) {
            return '<div class="panel-version-bar"><span class="panel-version-label">' + escapeHtml(label) + '</span><select class="panel-version-select" data-role="' + escapeHtml(role) + '" aria-label="' + escapeHtml(label) + '"></select></div>';
        }
        
        function renderContent(data) {
            const content = document.getElementById('content');
            const hasStoryReference = !!(data.story_transcript || (data.story_events && data.story_events.length > 0));
            // Story Segments tab: full story text (left) + segmented events (right). Show whenever the
            // pipeline includes story or recall-parse / recall-match, even if step0 is not in the panel.
            const showStoryEvents = stepInPanel(['step0', 'step1', 'step2', 'step3']) && (
                hasStoryReference ||
                stepParam === 'step0' ||
                stepParam === 'step2' ||
                stepParam === 'step3'
            );
            const showAudio = data.audio_file && stepInPanel(['step0_audio', 'step0_story_audio']);
            // Recall-only tabs (correct / parse / match) are per-subject concepts; never show them
            // in story context, where they render as empty/confusing dead-ends.
            const showRawProcessed = !isStory && stepInPanel(['step1']);
            // parsed_texts can be null if the file is missing from the API search path while the
            // dashboard still shows complete — still show the tab when inspecting this step.
            const showSegmented = !isStory && stepInPanel(['step2']) && (data.parsed_texts != null || stepParam === 'step2');
            const showMatched = !isStory && stepInPanel(['step3']);
            const showCausalMatrix = data.story_events && data.story_events.length > 0 && stepInPanel(['step0_causal']);
            const showCausalMatrixMissing = stepInPanel(['step0_causal']) && !(data.story_events && data.story_events.length > 0);
            let initialTab = getInitialTab();
            if (stepParam === 'step0_causal') {
                if (showCausalMatrix) initialTab = 'causal-matrix';
                else if (showCausalMatrixMissing) initialTab = 'causal-matrix-missing';
            }
            if (panelSteps && panelSteps.length) {
                const stepForParam = stepParam || 'step1';
                if (!stepInPanel([stepForParam])) {
                    if (showCausalMatrix) initialTab = 'causal-matrix';
                    else if (showCausalMatrixMissing) initialTab = 'causal-matrix-missing';
                    else if (showStoryEvents) initialTab = 'story-events';
                    else if (showAudio) initialTab = 'audio-transcription';
                    else if (showRawProcessed) initialTab = 'raw-processed';
                    else if (showSegmented) initialTab = 'segmented';
                    else if (showMatched) initialTab = 'matched';
                }
            }
            
            // Build tabs in dashboard step order (panelSteps), falling back to default order
            const tabDefs = [
                { step: 'step0_causal', id: 'causal-matrix', label: 'Causal Rating', show: showCausalMatrix },
                { step: 'step0_causal', id: 'causal-matrix-missing', label: 'Causal Rating', show: showCausalMatrixMissing },
                { step: 'step0', id: 'story-events', label: 'Story Segments', show: showStoryEvents },
                { step: 'step0_story_audio', id: 'audio-transcription', label: 'Audio Transcription', show: showAudio },
                { step: 'step0_audio', id: 'audio-transcription', label: 'Audio Transcription', show: showAudio },
                { step: 'step1', id: 'raw-processed', label: 'Corrected Recall', show: showRawProcessed },
                { step: 'step2', id: 'segmented', label: 'Parsed Recall', show: showSegmented },
                { step: 'step3', id: 'matched', label: 'Recall Matching', show: showMatched }
            ];
            let orderedTabs = [];
            const seenTabIds = new Set();
            if (panelSteps && panelSteps.length) {
                for (const ps of panelSteps) {
                    const def = tabDefs.find(t => t.step === ps && t.show && !seenTabIds.has(t.id));
                    if (def) { orderedTabs.push(def); seenTabIds.add(def.id); }
                }
            }
            // Append any remaining visible tabs not yet included (default order)
            for (const def of tabDefs) {
                if (def.show && !seenTabIds.has(def.id)) {
                    orderedTabs.push(def);
                    seenTabIds.add(def.id);
                }
            }
            const panelHasStep0 = !!(panelSteps && panelSteps.length && panelSteps.indexOf('step0') >= 0);
            const panelHasRecallStep = !!(panelSteps && panelSteps.length && (panelSteps.indexOf('step2') >= 0 || panelSteps.indexOf('step3') >= 0));
            const storySegmentsAddon = showStoryEvents && !panelHasStep0 && (panelHasRecallStep || stepParam === 'step2' || stepParam === 'step3');
            orderedTabs = orderInspectionTabs(orderedTabs, storySegmentsAddon);
            
            let html = `
                <div class="tabs">
                    ${orderedTabs.map(t => `<button class="tab ${initialTab === t.id ? 'active' : ''}" onclick="showTab('${t.id}')">${t.label}</button>`).join('')}
                </div>
            `;
            
            if (showCausalMatrix) {
                const storyEvents = data.story_events || [];
                const n = storyEvents.length;
                const causalData = data.causal_ratings;
                const existingPairs = {};
                if (causalData && causalData.pairs) {
                    causalData.pairs.forEach(p => {
                        const k = p.event_A + '_' + p.event_B;
                        existingPairs[k] = {
                            rating: p.rating || 0,
                            reasoning: p.reasoning || '',
                            causal_type: p.causal_type || '',
                            referential: p.referential || 0,
                            contextual: p.contextual || 0,
                            semantic: p.semantic || 0,
                        };
                    });
                }
                
                let matrixHeaderCells = '<th style="font-size:0.7em; line-height:1.1; padding:2px;">Cause →<br>Effect ↓</th>';
                for (let c = 0; c < n; c++) {
                    matrixHeaderCells += `<th title="${escapeHtml(storyEvents[c].text)}">${storyEvents[c].event}</th>`;
                }
                
                let matrixRows = '';
                for (let r = 0; r < n; r++) {
                    matrixRows += `<tr><th title="${escapeHtml(storyEvents[r].text)}">${storyEvents[r].event}</th>`;
                    for (let c = 0; c < n; c++) {
                        if (r === c) {
                            matrixRows += '<td class="causal-matrix-cell diagonal">\u2014</td>';
                        } else {
                            const causeEv = storyEvents[c].event;
                            const effectEv = storyEvents[r].event;
                            const key = causeEv + '_' + effectEv;
                            const ex = existingPairs[key] || {};
                            const rat = Math.min(ex.rating || 0, 3);
                            const hasReason = ex.reasoning && ex.reasoning !== 'manual entry' ? ' has-reasoning' : '';
                            matrixRows += '<td class="causal-matrix-cell rating-' + rat + hasReason + '" data-cause="' + causeEv + '" data-effect="' + effectEv + '" data-rating="' + rat + '" data-reasoning="' + escapeHtml(ex.reasoning || '') + '" data-causal-type="' + escapeHtml(ex.causal_type || '') + '" data-referential="' + (ex.referential || 0) + '" data-contextual="' + (ex.contextual || 0) + '" data-semantic="' + (ex.semantic || 0) + '" onclick="handleCausalCellClick(this)" onmouseenter="causalCellEnter(event, ' + c + ', ' + r + ')" onmousemove="moveCausalHover(event)" onmouseleave="causalCellLeave()">' + (rat || '') + '</td>';
                        }
                    }
                    matrixRows += '</tr>';
                }
                
                let eventsListHtml = storyEvents.map(ev =>
                    '<div class="causal-event-item" id="ce-item-' + ev.event + '"><div class="ce-num">Event ' + ev.event + '</div><div>' + escapeHtml(ev.text) + '</div></div>'
                ).join('');
                
                html += `
                    <div id="causal-matrix" class="tab-content ${initialTab === 'causal-matrix' ? 'active' : ''}">
                        <div class="causal-tab-layout">
                            <div class="causal-matrix-instructions">
                                <strong>Manual Causal Rating</strong> — rate how strongly each <span style="color:#93c5fd;">cause event</span> (column) led to each <span style="color:#fca5a5;">effect event</span> (row).<br>
                                <strong>How to rate:</strong>
                                &nbsp;<strong>1)</strong> Find a pair you think <em>is</em> causally related.
                                &nbsp;<strong>2)</strong> Click that cell and pick <span style="color:#93c5fd;">1</span>&nbsp;/&nbsp;<span style="color:#fbbf24;">2</span>&nbsp;/&nbsp;<span style="color:#fca5a5;">3</span>.
                                &nbsp;<strong>3)</strong> Skip every other pair — <span style="color:var(--t2);">0 is already the default</span>, so unrelated pairs need no input.
                                &nbsp;<strong>4)</strong> When done, click <strong>Export Causal Ratings</strong>.<br>
                                <strong>Scale:</strong>
                                <span style="color:var(--t2);">0</span> not at all &nbsp;·&nbsp;
                                <span style="color:#93c5fd;">1</span> slightly &nbsp;·&nbsp;
                                <span style="color:#fbbf24;">2</span> causally related &nbsp;·&nbsp;
                                <span style="color:#fca5a5;">3</span> extremely &nbsp;·&nbsp;
                                <span style="color:var(--t0);">&#9634;</span> outline = has reasoning &nbsp;·&nbsp;
                                <strong>&times;</strong> clears the cell.<br>
                                <strong>Tips:</strong> <em>hover</em> any cell to see its cause/effect text · <em>click</em> a rated cell again to re-rate or edit it. When any of the checkboxes below (<strong>Reasoning</strong> / <strong>Causal Type</strong> / <strong>Semantic</strong>) is on, every rating you pick — <em>including 0 and including the same number you had before</em> — opens the prompt for those fields, prefilled with your prior answers so you can review or change them; press <strong>Enter</strong> (or click a button) to save / leave blank to skip a single field; press <strong>Esc</strong> to skip the remaining fields and keep your rating. When all those checkboxes are off, picking a rating just replaces it instantly (no prompt). <strong>×</strong> wipes the whole cell (rating + reasoning) regardless of the checkboxes. The export destination folder must exist, but it does <em>not</em> need to contain an output file beforehand — the first export creates it.
                            </div>
                            <div class="causal-flags-bar">
                                <label><input type="checkbox" id="flag-reasoning" onchange="enableExportCausalMatrix()"> Reasoning</label>
                                <label><input type="checkbox" id="flag-causal-type" onchange="enableExportCausalMatrix()"> Causal Type</label>
                                <label><input type="checkbox" id="flag-semantic" onchange="enableExportCausalMatrix()"> Semantic</label>
                                <label class="nested-rating-toggle ${data.event_granularities ? '' : 'disabled'}" id="nested-rating-toggle" onclick="toggleNestedRating()">
                                    <input type="checkbox" id="flag-nested-rating" ${data.event_granularities ? '' : 'disabled'}> Nested Rating
                                </label>
                            </div>
                            <div class="causal-body">
                                <div class="causal-events-panel" id="causal-events-panel">
                                    <div class="causal-events-panel-resize-handle" id="causal-events-panel-resize-handle" title="Drag to resize panel"></div>
                                    ${panelVersionBarMarkup('Story segmentation file', 'story-events')}
                                    <div class="causal-lines-toggle-bar" id="causal-lines-toggle-bar">
                                        <select id="causal-lines-mode" onchange="setCausalLinesMode(this.value); updateCausalConnectionLines();" title="Show connection lines">
                                            <option value="off">Hide lines</option>
                                            <option value="causal" selected>Causal (blue)</option>
                                            <option value="semantic">Semantic (magenta)</option>
                                        </select>
                                    </div>
                                    <div class="causal-events-inner">
                                        <svg class="causal-lines-svg" id="causal-lines-svg" preserveAspectRatio="none"></svg>
                                        <div class="causal-events-list" id="causal-events-list" onclick="handleCausalEventListClick(event)">${eventsListHtml}</div>
                                    </div>
                                </div>
                                <div class="causal-matrix-column">
                                    ${panelVersionBarMarkup('Causal rating file', 'causal-rating-file')}
                                    <div class="causal-matrix-wrapper">
                                        <table class="causal-matrix-table">
                                            <thead><tr>${matrixHeaderCells}</tr></thead>
                                            <tbody>${matrixRows}</tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div class="causal-matrix-footer">
                                <button id="export-causal-matrix" class="export-button" disabled data-export-path="${escapeHtml(String((data.default_export_paths && data.default_export_paths.causal) || ''))}" onclick="showExportModal('causal', (window._causalRatingsData && window._causalRatingsData.source_file) || '', function(path){ saveCausalMatrix(path); }, this)">Export Causal Ratings</button>
                                <div id="save-causal-matrix-status" class="save-status"></div>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (showCausalMatrixMissing) {
                html += `
                    <div id="causal-matrix-missing" class="tab-content ${initialTab === 'causal-matrix-missing' ? 'active' : ''}">
                        <div class="causal-matrix-instructions" style="border-color: var(--acc3);">
                            <strong>Story events file not found.</strong> The dashboard found this story from your pipeline input folder, but the app could not load a matching <code style="color: var(--t2);">{story}_events.xlsx</code> file with <code style="color: var(--t2);">event</code> and <code style="color: var(--t2);">story_texts</code> columns.<br><br>
                            Check that the causal-rating (or event-segmentation) <strong>input folder</strong> in Pipeline Config points at the folder containing the events file, then reload this page. If the file lives elsewhere, set that folder as the step input path or copy the events file into <code style="color: var(--t2);">data/3_story_events/</code>.
                        </div>
                    </div>
                `;
            }
            
            if (showStoryEvents) {
                const storyEvents = data.story_events || [];
                const storyFullTextLeft = (data.story_transcript && String(data.story_transcript).trim()) ||
                    (storyEvents.length
                        ? storyEvents.map(function(e) { return (e.text || '').trim(); }).filter(Boolean).join('\n\n')
                        : '');
                html += `
                    <div id="story-events" class="tab-content ${initialTab === 'story-events' ? 'active' : ''}">
                        <div class="story-rated-container">
                            <div class="story-panel">
                                ${panelVersionBarMarkup('Story text file', 'story-transcript')}
                                <h2>Story text (reference)</h2>
                                <p style="color: var(--t3); font-size: 0.85em; margin: 0 0 8px 0;">Full story transcript (e.g. from <code style="color: var(--t2);">data/2_story_transcript</code>). On the right: editable story segments.</p>
                                <div class="story-scrollable">
                                    ${storyFullTextLeft ? `
                                    <div class="text-display" style="white-space: pre-wrap; word-wrap: break-word; padding: 15px; text-align: left; text-indent: 0;">${escapeHtml(storyFullTextLeft)}</div>
                                    ` : `
                                    <div class="text-content empty" style="padding: 20px; text-align: center;">
                                        No story transcript loaded. Add a <code style="color: var(--t2);">&lt;story&gt;.txt</code> under <code style="color: var(--t2);">data/2_story_transcript</code>, or ensure <code style="color: var(--t2);">&lt;story&gt;_events*.xlsx</code> includes segment text so the app can reconstruct the full story.
                                    </div>
                                    `}
                                </div>
                            </div>
                            <div class="rated-panel">
                                ${panelVersionBarMarkup('Story segmentation file', 'story-events')}
                                <div id="story-events-notification" class="story-events-notification hidden">
                                    <button class="story-events-notification-close" onclick="dismissNotification('story-events-notification-dismissed')" title="Dismiss">×</button>
                                    <strong>Editing Story Segmentation:</strong> Move the cursor through the text — a red bar follows it between words. Click to drop a segment boundary there (the following text reflows into a new box); click an existing bar to remove it. Use the toggle at the top right to switch between <strong>binary</strong> boundaries and <strong>1&ndash;5</strong> strength boundaries. In 1&ndash;5 mode, clicking a boundary opens a picker (1 = weak &rarr; 5 = strong) and the bar is colored by its strength (blue &rarr; red); the strength is written to a <strong>boundary_strength</strong> column on export.
                                </div>
                                <div class="seg-panel-header">
                                    <h2>Story segments</h2>
                                    <div class="seg-mode-toggle" data-panel="story">
                                        <span class="seg-mode-label seg-mode-binary active">binary</span>
                                        <label class="seg-switch"><input type="checkbox" onchange="setSegMode('story', this.checked ? 'scale' : 'binary')"><span class="seg-slider"></span></label>
                                        <span class="seg-mode-label seg-mode-scale">1&ndash;5</span>
                                    </div>
                                </div>
                                <div class="rated-scrollable">
                                    <div class="seg-flow" data-panel="story"></div>
                                </div>
                                <div style="flex-shrink: 0; margin-top: 15px;">
                                    <button id="export-story-events" class="export-button" disabled data-export-path="${escapeHtml(String((data.default_export_paths && data.default_export_paths['story-events']) || ''))}" onclick="showExportModal('story-events', (typeof currentStoryEventsFile !== 'undefined' && currentStoryEventsFile) ? currentStoryEventsFile : '', function(path){ saveStoryEvents(path); }, this)">Export Edited File</button>
                                    <div id="save-story-events-status" class="save-status"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if (data.audio_file && showAudio) {
                const transcription = data.audio_transcription || '';
                // Use API route so the server serves the correct file (avoids path/static issues)
                const audioUrl = isStory ? `/api/story/${encodeURIComponent(subjectId)}/audio` : `/api/subject/${encodeURIComponent(subjectId)}/audio`;
                const ext = (data.audio_file || '').toLowerCase().split('.').pop();
                const audioExtMap = { mp3: 'audio/mpeg', wav: 'audio/wav', mp4: 'audio/mp4', m4a: 'audio/mp4',
                    flac: 'audio/flac', ogg: 'audio/ogg', webm: 'audio/webm', aac: 'audio/aac' };
                const audioExt = audioExtMap[ext] || 'audio/wav';
                html += `
                    <div id="audio-transcription" class="tab-content ${initialTab === 'audio-transcription' ? 'active' : ''}">
                        <div class="side-by-side-container">
                            <div class="side-by-side-panel">
                                <h2>Audio Player</h2>
                                <div style="flex-shrink: 0; margin-bottom: 16px;">
                                    <audio id="audio-player" controls style="width: 100%;" preload="metadata">
                                        <source src="${audioUrl}" type="${audioExt}">
                                        Your browser does not support the audio element.
                                    </audio>
                                </div>
                                <h2 style="margin-top: 16px;">Transcription (read-only)</h2>
                                <div id="audio-transcription-display" class="audio-transcription-display"
                                     style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 15px; background: var(--bg2); border-radius: 6px; border: 1px solid var(--bdr); line-height: 1.8; font-size: 1.05em; color: var(--t1); white-space: pre-wrap; word-wrap: break-word;">
                                </div>
                            </div>
                            <div class="side-by-side-panel">
                                <h2>Transcribed Text (edit here)</h2>
                                <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;">
                                    <textarea id="audio-transcription-editor" 
                                              class="text-editor" 
                                              style="flex: 1; min-height: 200px; width: 100%; margin-top: 0;"
                                              placeholder="Transcribed text will appear here..."
                                              oninput="syncAudioTranscriptionFromEditor(); enableExportAudio();"
                                              onclick="highlightWordAtCursor();"
                                              onkeyup="highlightWordAtCursor();">${escapeHtml(transcription)}</textarea>
                                </div>
                                <div style="flex-shrink: 0; margin-top: 15px;">
                                    <button id="export-audio" class="export-button" disabled data-export-path="${escapeHtml(String((data.default_export_paths && data.default_export_paths.audio) || ''))}" onclick="showExportModal('audio', '', function(path){ saveAudioTranscription(path); }, this)">Export Edited File</button>
                                    <div id="save-audio-transcription-status" class="save-status"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if (showRawProcessed) {
                html += `
                <div id="raw-processed" class="tab-content ${initialTab === 'raw-processed' ? 'active' : ''}">
                    <div class="side-by-side-container">
                        <div class="side-by-side-panel">
                            <h2>Raw Recall Text</h2>
                            <div id="raw-text-display" class="text-display ${!rawText ? 'empty' : ''}">
                                ${escapeHtml(rawText) || 'No raw recall text available'}
                            </div>
                        </div>
                        <div class="side-by-side-panel">
                            ${panelVersionBarMarkup('Processed recall file', 'recall-pipeline')}
                            <div id="raw-processed-notification" class="story-events-notification hidden">
                                <button class="story-events-notification-close" onclick="dismissNotification('raw-processed-notification-dismissed')" title="Dismiss">×</button>
                                <strong>Editing Processed Text:</strong> You can directly edit the processed text in the textarea to make spell and grammar corrections. The raw recall text on the left is shown for reference. Make conservative corrections (no sentence structure changes) and click "Export Edited File" when done.
                            </div>
                            <h2>Processed Text</h2>
                            <div id="corrected-text-editor" contenteditable="true" class="corrected-text-editable ${!correctedText ? 'empty' : ''}" data-placeholder="No processed text available" oninput="enableExportCorrected(); debouncedUpdateProcessedHighlight();" onblur="updateProcessedHighlight();">${rawText && correctedText ? computeHighlightedProcessedHtml(rawText, correctedText) : escapeHtml(correctedText || '')}</div>
                            <button id="export-corrected" class="export-button" disabled data-export-path="${escapeHtml(String((data.default_export_paths && data.default_export_paths.corrected) || ''))}" onclick="showExportModal('corrected', '', function(path){ saveCorrectedText(path); }, this)">Export Edited File</button>
                            <div id="save-status" class="save-status"></div>
                        </div>
                    </div>
                </div>
            `;
            }
            
            if (showSegmented) {
                // Left panel shows the full recall text being segmented (the
                // processed/corrected recall, falling back to the raw recall or
                // the joined recall segments) — not the story segments.

        function computeHighlightedProcessedHtml(raw, processed) {
            if (!raw || !processed) return escapeHtml(processed || '');
            const rawWords = raw.trim().split(/\s+/).filter(w => w.length > 0);
            const procWords = processed.trim().split(/\s+/).filter(w => w.length > 0);
            if (procWords.length === 0) return escapeHtml(processed);
            if (rawWords.length === 0) return procWords.map(w => `<span class="processed-changed">${escapeHtml(w)}</span>`).join(' ');
            const n = rawWords.length, m = procWords.length;
            const dp = Array(n + 1).fill(null).map(() => Array(m + 1).fill(0));
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    if (rawWords[i - 1] === procWords[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }
            const changedIndices = new Set();
            let i = n, j = m;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && rawWords[i - 1] === procWords[j - 1]) {
                    i--; j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    changedIndices.add(j - 1);
                    j--;
                } else {
                    i--;
                }
            }
            return procWords.map((w, idx) =>
                changedIndices.has(idx) ? `<span class="processed-changed">${escapeHtml(w)}</span>` : escapeHtml(w)
            ).join(' ');
        }

        function getCorrectedCaretOffset() {
            if (!correctedTextElement) return 0;
            const sel = window.getSelection();
            if (!sel.rangeCount) return 0;
            const range = sel.getRangeAt(0);
            const preCaretRange = range.cloneRange();
            preCaretRange.selectNodeContents(correctedTextElement);
            preCaretRange.setEnd(range.endContainer, range.endOffset);
            return preCaretRange.toString().length;
        }
        
        function setCorrectedCaretOffset(offset) {
            if (!correctedTextElement) return;
            const sel = window.getSelection();
            const range = document.createRange();
            if (offset <= 0) {
                range.setStart(correctedTextElement, 0);
                range.collapse(true);
            } else {
                let charCount = 0;
                const walk = (node) => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        const len = node.textContent.length;
                        if (charCount + len >= offset) {
                            range.setStart(node, Math.min(offset - charCount, len));
                            range.collapse(true);
                            return true;
                        }
                        charCount += len;
                    } else {
                        for (let i = 0; i < node.childNodes.length; i++) {
                            if (walk(node.childNodes[i])) return true;
                        }
                    }
                    return false;
                };
                if (!walk(correctedTextElement)) {
                    range.selectNodeContents(correctedTextElement);
                    range.collapse(false);
                }
            }
            sel.removeAllRanges();
            sel.addRange(range);

        function tokenizeText(text) {
            // Split text into tokens (words and whitespace)
            const tokens = [];
            const parts = text.split(/(\s+)/);
            let wordIndex = 0;
            
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                if (part.trim()) {
                    tokens.push({ text: part, isWord: true, wordIndex: wordIndex++ });
                } else if (part) {
                    tokens.push({ text: part, isWord: false, wordIndex: -1 });
                }
            }
            
            return tokens;
        }
        
        function highlightCorrespondingText(element, sourceWords, isFromRaw) {
            // Remove previous highlights from raw text
            rawTextElement.querySelectorAll('.word').forEach(span => {
                span.classList.remove('highlight', 'active');
            });
            
            if (isFromRaw) {
                // Highlight clicked word in raw text
                element.classList.add('highlight', 'active');
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // Find corresponding position in corrected text by POSITION, not word content
                const rawWordIndex = parseInt(element.getAttribute('data-index'));
                
                // Get current corrected text
                const currentCorrectedText = getCorrectedTextContent();
                const correctedWords = tokenizeText(currentCorrectedText);
                
                // Map word index from raw text to corrected text using proportional mapping
                let targetWordIndex = rawWordIndex;
                const rawWordCount = sourceWords.filter(t => t.isWord).length;
                const correctedWordCount = correctedWords.filter(t => t.isWord).length;
                
                if (rawWordCount > 0 && correctedWordCount > 0 && rawWordCount !== correctedWordCount) {
                    // Use proportional mapping to handle cases where texts have different word counts
                    const ratio = rawWordIndex / (rawWordCount - 1);
                    targetWordIndex = Math.round(ratio * (correctedWordCount - 1));
                }
                
                // Ensure index is within bounds
                targetWordIndex = Math.max(0, Math.min(targetWordIndex, correctedWordCount - 1));
                
                // Find character position for the word at targetWordIndex
                let charPos = 0;
                let wordCount = 0;
                for (let i = 0; i < correctedWords.length; i++) {
                    if (correctedWords[i].isWord) {
                        if (wordCount === targetWordIndex) {
                            break;
                        }
                        wordCount++;
                    }
                    charPos += correctedWords[i].text.length;
                }
                
                // Scroll and position cursor
                correctedTextElement.focus();
                setCorrectedCaretOffset(charPos);
                
                // Scroll to position
                const lineHeight = parseInt(getComputedStyle(correctedTextElement).lineHeight) || 20;
                const linesBefore = (currentCorrectedText.substring(0, charPos).match(/\n/g) || []).length;
                correctedTextElement.scrollTop = linesBefore * lineHeight - correctedTextElement.clientHeight / 2;
            }

        function highlightFromCorrectedText() {
            const currentCorrectedText = getCorrectedTextContent();
            const correctedWords = tokenizeText(currentCorrectedText);
            
            // Get cursor position
            const cursorPos = getCorrectedCaretOffset();
            
            // Find which word the cursor is in or nearest to
            let charCount = 0;
            let targetWordIndex = -1;
            
            for (let i = 0; i < correctedWords.length; i++) {
                const token = correctedWords[i];
                const tokenEnd = charCount + token.text.length;

                    targetWordIndex = token.wordIndex;

                charCount = tokenEnd;

                let nearestIndex = -1;

                    const token = correctedWords[i];

                        const tokenEnd = charCount + token.text.length;

            // Use the same word index to maintain positional alignment

                    rawWordIndex = Math.min(targetWordIndex, rawWordSpans.length - 1);
                }

        let ratedTextsData = [];

        // ---- Bar-based segmentation state (event + recall segmentation tabs) ----
        // For each panel: fullText is an immutable joined string; boundaries is a
        // list of {offset, strength} placed at word-start character offsets in
        // fullText; mode is 'binary' or 'scale' (1-5).
        let segState = { story: null, recall: null };

            return panel === 'story' ? storyEventsData : parsedTextsData;

        // Build fullText from the loaded segments and seed a boundary at each
        // existing inter-segment break, then render. Re-called on every data load.
        function initSegmenter(panel) {
            const container = document.querySelector(`.seg-flow[data-panel="${panel}"]`);
            if (!container) return;
            const segs = segSourceData(panel)
                .map(s => ((s && s.text) || '').trim())
                .filter(Boolean);
            let fullText = '';
            const boundaries = [];
            segs.forEach((seg, i) => {
                if (i > 0) {
                    fullText += ' ';
                    boundaries.push({ offset: fullText.length, strength: null });
                }
                fullText += seg;
            });
            segState[panel] = { fullText: fullText, boundaries: boundaries, mode: 'binary' };

            const toggle = document.querySelector(`.seg-mode-toggle[data-panel="${panel}"]`);
            if (toggle) {

                if (input) input.checked = false;

                container.addEventListener('mousemove', e => onSegFlowMouseMove(panel, e));
                container.addEventListener('mouseleave', () => hideSegCursorBar(panel));

        function renderSegmenter(panel) {
            const container = document.querySelector(`.seg-flow[data-panel="${panel}"]`);
            const st = segState[panel];
            if (!container || !st) return;
            if (!st.fullText) {
                const msg = panel === 'story'
                    ? 'No story events loaded. Add a story events file under data/3_story_events, or run the Story Event Segmentation step.'
                    : 'No recall segments loaded. Run the parsing step or add a parsed recall file.';
                container.innerHTML = `<div class="text-content empty" style="padding: 20px; text-align: center;">${escapeHtml(msg)}</div>`;
                container._segBar = null;
                container._segSnapOffset = null;
                return;
            }
            const offsets = st.boundaries.slice().sort((a, b) => a.offset - b.offset);
            const points = [0, ...offsets.map(b => b.offset), st.fullText.length];
            let html = '';
            for (let i = 0; i < points.length - 1; i++) {
                const start = points[i];
                const end = points[i + 1];
                const slice = st.fullText.slice(start, end);
                html += `<div class="seg-block">${renderSegBlockInner(slice, start)}`;
                // Boundary that ends this block (all but the last block).
                if (i < offsets.length) {
                    const b = offsets[i];
                    const strHtml = (st.mode === 'scale')
                        ? `<span class="seg-bstr">${b.strength != null ? b.strength : '?'}</span>`
                        : '';
                    // In 1-5 mode color the bar by its strength (blue -> red); a
                    // boundary without an assigned strength gets the neutral class.
                    const bCls = (st.mode === 'scale')
                        ? (b.strength != null ? `seg-boundary ss-${b.strength}` : 'seg-boundary ss-none')
                        : 'seg-boundary';
                    html += `<span class="${bCls}" data-offset="${b.offset}" title="Click to ${st.mode === 'scale' ? 'change strength / remove' : 'remove'} this boundary">${strHtml}</span>`;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
            // The bar lives as a direct child of <body>, not inside .seg-flow.
            // Reason: .seg-flow is nested under the page's `zoom: 0.8`, which
            // scales every coordinate inside it — making clientX vs the bar's
            // CSS `left` no longer the same coordinate space. Appending to the
            // body keeps the bar in true viewport pixels (same space as
            // clientX/Y and getBoundingClientRect), so the math is just
            // `bar.left = clientX`. innerHTML on the container doesn't touch
            // body-level children, so the bar survives a re-render.
            let bar = container._segBar;
            if (!bar || !document.body.contains(bar)) {
                bar = document.createElement('div');
                bar.className = 'seg-cursor-bar';
                document.body.appendChild(bar);
                container._segBar = bar;
            }
            bar.style.opacity = '0';

            container._segSnapIsBoundary = false;

            // have re-laid-out (font-size override, resize, etc.) so we want

        // Render a block slice as word spans separated by clickable gap zones.
        // The gap before a word carries that word's absolute start offset; the
        // block's first word has no preceding gap (that position is already a
        // boundary or the text start).
        function renderSegBlockInner(slice, baseOffset) {
            let out = '';
            const re = /\S+/g;
            let m;
            let first = true;
            let lastEnd = 0;
            while ((m = re.exec(slice)) !== null) {
                const wordStart = baseOffset + m.index;
                if (first) {
                    first = false;
                } else {
                    // Whitespace run between previous word and this one becomes a gap.
                    const gapText = slice.slice(lastEnd, m.index) || ' ';
                    out += `<span class="seg-gap" data-offset="${wordStart}">${escapeHtml(gapText)}</span>`;
                }
                out += `<span class="seg-word">${escapeHtml(m[0])}</span>`;
                lastEnd = m.index + m[0].length;
            }
            return out;
        }

        // Click places (or removes) a boundary at the snapped bar position — the
        // spot the floating red bar is showing — so the drop is immediate and
        // matches what the user sees, even though the native cursor is hidden.
        function onSegFlowClick(panel, e) {
            const st = segState[panel];
            if (!st) return;
            const container = e.currentTarget;
            const offset = container._segSnapOffset;
            if (offset == null) return;
            if (container._segSnapIsBoundary) {
                if (st.mode === 'scale') openSegStrengthPicker(panel, offset, e.clientX, e.clientY, true);
                else removeSegBoundary(panel, offset);
                return;
            }
            if (st.boundaries.some(b => b.offset === offset)) return;
            if (st.mode === 'scale') openSegStrengthPicker(panel, offset, e.clientX, e.clientY, false);
            else addSegBoundary(panel, offset, null);
        }

        // rAF-throttled: track the latest pointer position, then snap the red bar
        // to the nearest word gap (or existing boundary) on the next frame.
        function onSegFlowMouseMove(panel, e) {
            const container = e.currentTarget;
            container._segLastXY = { x: e.clientX, y: e.clientY };
            if (container._segRaf) return;
            container._segRaf = requestAnimationFrame(function () {
                container._segRaf = null;
                positionSegCursorBar(panel, container);
            });
        }

        // Walk a word's siblings to find the nearest gap/boundary on one side.
        function segAdjacentCand(word, dir) {
            let n = (dir === 'prev') ? word.previousElementSibling : word.nextElementSibling;
            while (n) {
                if (n.classList && (n.classList.contains('seg-gap') || n.classList.contains('seg-boundary'))) return n;
                n = (dir === 'prev') ? n.previousElementSibling : n.nextElementSibling;
            }
            return null;
        }

        function positionSegCursorBar(panel, container) {
            const bar = container._segBar;
            const xy = container._segLastXY;
            if (!bar || !xy) return;

            // ---- 1. Place the bar EXACTLY where the pointer is.
            // NO element lookup, NO snapping for the visible position, NO line
            // anchor. The bar is the cursor — so its X = clientX, its Y is
            // centered on clientY, with a fixed height = the container's
            // line-height. This means the bar moves pixel-for-pixel with the
            // pointer regardless of whether the pointer is over a word, a
            // gap, a placed boundary, segment-block padding, or any other
            // sub-pixel sliver between elements. Previously the bar's Y/height
            // came from whichever element elementFromPoint returned — that
            // element changed (.seg-word vs .seg-gap vs .seg-boundary, each
            // with slightly different bcr.top/height), which is what made
            // the bar hop between words / segments / over boundaries.
            //
            // All values are written in CSS px. The page has `zoom: 0.8` on
            // <html>, which scales *every* element on render (including
            // position: fixed). clientX/Y are in unscaled visual viewport
            // pixels, so we divide by zoom to map them into the CSS px space
            // the browser will then re-scale on paint.
            const zoomCS = parseFloat(window.getComputedStyle(document.documentElement).zoom);
            const zoom = (isFinite(zoomCS) && zoomCS > 0) ? zoomCS : 1;

            // Bar height = container's CSS line-height (e.g. 2.1em). We read
            // it once via getComputedStyle and cache it; the segmenter font
            // size doesn't change at runtime.
            if (!container._segLineHeightCss) {
                const csC = window.getComputedStyle(container);
                let lh = parseFloat(csC.lineHeight);
                if (!isFinite(lh) || lh <= 0) {
                    const fs = parseFloat(csC.fontSize) || 16;
                    lh = fs * 2.1;
                }

        function getSegmentsForExport(panel) {
            const st = segState[panel];
            if (!st || !st.fullText) return [];
            const offsets = st.boundaries.slice().sort((a, b) => a.offset - b.offset);
            const points = [0, ...offsets.map(b => b.offset), st.fullText.length];
            const out = [];
            for (let i = 0; i < points.length - 1; i++) {
                const text = st.fullText.slice(points[i], points[i + 1]).trim();
                if (!text) continue;
                const strength = (i < offsets.length) ? offsets[i].strength : null;
                out.push({ text: text, strength: strength });

        function _bindCausalRatingPickerButtons(wrapperEl, targetCell) {
