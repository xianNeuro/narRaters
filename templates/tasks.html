<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My stories — narRaters</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="shortcut icon" href="/static/favicon/favicon.ico">
    <script src="/static/zoom-controls.js"></script>
    <style>
        :root { --bg0:#0b0d14; --bg1:#111527; --bg2:#1a1f36; --t0:#f0f2f5; --t1:#c4c9db; --t2:#8890a8;
                --bdr:#2a3050; --acc:#6c63ff; --grn:#22c55e; --ylw:#f59e0b; --red:#ef4444; --rad:10px; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg0); color: var(--t0);
               font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px;
                 border-bottom: 1px solid var(--bdr); background: var(--bg1); flex-wrap: wrap; gap: 8px; }
        header h1 { font-size: 1.15em; margin: 0; }
        .hdr-actions { display: flex; align-items: center; gap: 8px; }
        .hdr-btn { color: var(--t1); text-decoration: none; background: var(--bg2); border: 1px solid var(--bdr);
                   border-radius: 6px; padding: 4px 12px; font: inherit; font-size: .9em; cursor: pointer; }
        .hdr-btn:hover { border-color: var(--acc); color: var(--t0); }
        /* the zoom script's floating buttons are replaced by the header's - / + */
        .page-zoom-controls { display: none !important; }
        main { max-width: 940px; margin: 0 auto; padding: 24px 16px 60px; }
        table { width: 100%; border-collapse: collapse; background: var(--bg1); border-radius: var(--rad); overflow: hidden; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--bdr); text-align: left; vertical-align: middle; }
        th { color: var(--t2); font-weight: 600; font-size: 0.85em; text-transform: uppercase; letter-spacing: .04em; }
        .story { font-weight: 600; }
        .muted { color: var(--t2); font-size: 0.85em; }
        .btn { display: inline-block; padding: 6px 14px; border-radius: 8px; text-decoration: none;
               font-weight: 600; font-size: 0.9em; border: 1px solid var(--acc); color: #fff; background: var(--acc); }
        .btn.secondary { background: transparent; color: var(--t1); border-color: var(--bdr); }
        .btn.disabled { pointer-events: none; opacity: .4; background: transparent; border-color: var(--bdr); color: var(--t2); }
        .pill { display: inline-block; font-size: 0.78em; font-weight: 700; padding: 2px 9px; border-radius: 99px; margin-right: 8px; }
        .s-not_started { background: #2a3050; color: var(--t1); }
        .s-in_progress { background: rgba(245,158,11,.18); color: var(--ylw); }
        .s-submitted { background: rgba(34,197,94,.18); color: var(--grn); }
        .s-submitted_edited { background: rgba(34,197,94,.18); color: var(--grn); }
        .s-locked { background: transparent; color: var(--t2); border: 1px dashed var(--bdr); }
        .empty { padding: 30px; text-align: center; color: var(--t2); }
        tr.batch-header td { background: var(--bg2); color: var(--t0); font-weight: 600; font-size: 12px;
                             text-transform: uppercase; letter-spacing: .6px; padding: 6px 14px; }
    </style>
</head>
<body>
<header>
    <h1>DFRN story causal rating</h1>
    <div class="hdr-actions"><span class="muted">Signed in as <strong>{{ username }}</strong></span>
        <button type="button" class="hdr-btn" onclick="if(window.PageZoom)PageZoom.out()" title="Make the page smaller">-</button>
        <button type="button" class="hdr-btn" onclick="if(window.PageZoom)PageZoom.in()" title="Make the page bigger">+</button>
        {% if require_auth %}<a class="hdr-btn" href="/logout">Log out</a>{% endif %}
        <span class="muted" style="font-size:.85em">{{ narraters_version }}</span></div>
</header>
<main>
    <table>
        <thead><tr><th>Story</th><th>Events</th><th>Part 1 · Segmentation</th><th>Part 2 · Causal rating</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
</main>
<script>
    const LABEL = { not_started: 'Not started', in_progress: 'In progress', submitted: 'Submitted',
                    submitted_edited: 'Submitted · edited since', locked: 'Do Part 1 first' };
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function cell(href, part, info) {
        const state = (part === 'causal' && info.locked) ? 'locked' : info.state;
        const verb = state === 'not_started' ? 'Start' : (state.startsWith('submitted') ? 'Review' : 'Continue');
        const extra = part === 'causal' && info.n_pairs != null ? ` <span class="muted">${info.n_pairs} pairs</span>` : '';
        const btn = state === 'locked'
            ? '<span class="btn disabled">Locked</span>'
            : `<a class="btn ${state.startsWith('submitted') ? 'secondary' : ''}" href="${href}">${verb}</a>`;
        return `<span class="pill s-${state}">${LABEL[state]}</span>${extra}<div style="margin-top:6px">${btn}</div>`;
    }
    fetch('/api/tasks').then(r => r.json()).then(data => {
        const rows = document.getElementById('rows');
        if (!data.stories || !data.stories.length) {
            rows.innerHTML = '<tr><td colspan="4" class="empty">No stories have been assigned to you yet.</td></tr>';
            return;
        }
        const manySources = new Set(data.stories.map(s => s.datasource)).size > 1;
        // Stories arrive ordered by batch; a header row starts each batch.
        let html = '';
        let prevBatch = null;
        for (const s of data.stories) {
            if (s.batch !== prevBatch) {
                prevBatch = s.batch;
                html += `<tr class="batch-header"><td colspan="4">Batch: ${esc(s.batch)}</td></tr>`;
            }
            html += `<tr><td class="story">${esc(s.story)}${manySources ? ` <span class="muted">(${esc(s.datasource)})</span>` : ''}</td><td>${s.n_events}</td>
                <td>${cell(s.url_segment, 'segment', s.segment)}</td>
                <td>${cell(s.url_causal, 'causal', s.causal)}</td></tr>`;
        }
        rows.innerHTML = html;
    }).catch(() => {
        document.getElementById('rows').innerHTML = '<tr><td colspan="4" class="empty">Could not load your stories. Please reload.</td></tr>';
    });
</script>
</body>
</html>
